<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ares RPG - Concurso</title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        :root { --primary: #3b82f6; --success: #22c55e; --danger: #ef4444; --bg: #0f172a; --card: #1e293b; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: #f8fafc; padding: 15px; margin: 0; }
        .container { max-width: 600px; margin: auto; }
        .stats-bar { background: var(--card); padding: 15px; border-radius: 12px; display: flex; justify-content: space-around; margin-bottom: 20px; border: 1px solid var(--primary); }
        .stat-item { text-align: center; }
        .stat-value { display: block; font-size: 1.2rem; font-weight: bold; color: var(--primary); }
        .questao { background: var(--card); padding: 20px; border-radius: 15px; border: 1px solid rgba(51, 65, 85, 0.5); margin-bottom: 20px; position: relative; }
        .bloqueado { opacity: 0.5; pointer-events: none; }
        .timer-msg { color: var(--danger); font-size: 0.8rem; margin-top: 10px; display: none; }
        .bloqueado .timer-msg { display: block; }
        .badge { background: var(--primary); padding: 4px 10px; border-radius: 6px; font-size: 0.75rem; font-weight: bold; margin-bottom: 10px; display: inline-block; }
        .opcao { display: block; width: 100%; padding: 14px; margin: 10px 0; background: rgba(15, 23, 42, 0.6); border: 1px solid #334155; border-radius: 10px; color: #cbd5e1; cursor: pointer; text-align: left; transition: 0.2s; }
        .opcao:hover { background: var(--primary); color: white; }
    </style>
</head>
<body>

<div class="container">
    <div class="stats-bar">
        <div class="stat-item"><span class="stat-value" id="total-hoje">0</span>Acertos Hoje</div>
        <div class="stat-item"><span class="stat-value" id="percentual">0%</span>Precisão</div>
    </div>

    <div id="quiz"></div>
</div>

<script>
    const COOLDOWN_HOURS = 4;
    const questoes = [
        { id: 1, cat: "RACIOCÍNIO LÓGICO", q: "Um lote com 200 caixas chegou ao galpão. O sistema acusa que 10% vieram com erro. Quantas caixas estão com erro?", opts: ["10 caixas", "20 caixas", "2 caixas"], corr: 1, exp: "Macete: 10% de um número terminado em zero, basta esconder o último zero! 200 vira 20." },
        
        { id: 2, cat: "INFORMÁTICA", q: "No Microsoft Word em português, qual o comando de teclado para SALVAR o documento?", opts: ["Ctrl + S", "Ctrl + B", "Ctrl + P"], corr: 1, exp: "No Word/Excel em português, o comando é Ctrl + B (de baixar/salvar no disco)." },
        
        { id: 3, cat: "DIREITO CONSTITUCIONAL", q: "Em qual caso a autoridade PODE entrar na casa de alguém durante a NOITE sem consentimento?", opts: ["Cumprir mandado judicial", "Prestar socorro ou flagrante", "Suspeita de crime grave"], corr: 1, exp: "Mandado judicial só de dia. Socorro, desastre ou flagrante pode a qualquer hora." },
        
        { id: 4, cat: "MATEMÁTICA", q: "Se 5 vigilantes fazem a ronda em 40 minutos, quanto tempo 10 vigilantes (mesmo ritmo) levariam para fazer a mesma ronda?", opts: ["80 minutos", "40 minutos", "20 minutos"], corr: 2, exp: "Proporcionalidade inversa: dobrou o pessoal, o tempo de trabalho cai pela metade." },
        
        { id: 5, cat: "ÉTICA / DIREITO", q: "Qual a penalidade para o servidor público que aceita vantagem indevida (propina) no exercício da função?", opts: ["Advertência", "Suspensão", "Demissão"], corr: 2, exp: "Corrupção é falta gravíssima. A lei prevê a demissão imediata do serviço público." },
        
        { id: 6, cat: "INFORMÁTICA / SEGURANÇA", q: "Como se chama o ataque que usa e-mails falsos para 'pescar' senhas e dados de usuários?", opts: ["Firewall", "Phishing", "Spam"], corr: 1, exp: "Phishing vem de 'fishing' (pescar). É a isca digital para roubar dados sensíveis." },
        
        { id: 7, cat: "LÓGICA / INVESTIMENTO", q: "Proposta A: R$ 180 fixos. Proposta B: 10% de um prêmio de R$ 2.000. Qual proposta paga mais?", opts: ["Proposta A", "Proposta B", "As duas são iguais"], corr: 1, exp: "10% de 2.000 é R$ 200. Logo, a Proposta B (200) é maior que a A (180)." },
        
        { id: 8, cat: "ADMINISTRATIVO / PRF", q: "O agente deve agir com ZELO ao manusear equipamentos. A palavra ZELO tem o mesmo sentido de:", opts: ["Desprezo", "Pressa", "Cuidado"], corr: 2, exp: "Zelo significa ter cuidado, atenção e responsabilidade com o que é público." },
        
        { id: 9, cat: "MEIO AMBIENTE", q: "Qual a principal função da Camada de Ozônio para o planeta Terra?", opts: ["Produzir oxigênio", "Filtrar raios ultravioletas (UV)", "Manter os mares calmos"], corr: 1, exp: "A camada de ozônio protege os seres vivos filtrando a radiação UV nociva do Sol." },

        { id: 10, cat: "ADMINISTRAÇÃO", q: "O princípio da Administração Pública que exige que o agente atue de forma transparente e ética é o da:", opts: ["Eficiência", "Moralidade", "Impessoalidade"], corr: 1, exp: "Pela Moralidade, o servidor deve seguir não só a lei, mas também a ética e o bem comum." },

        { id: 11, cat: "MEIO AMBIENTE", q: "O efeito estufa é um processo natural que, quando intensificado pela poluição, causa o:", opts: ["Resfriamento Global", "Aquecimento Global", "Aumento do Magnetismo"], corr: 1, exp: "O excesso de gases poluentes retém mais calor na atmosfera, gerando o aquecimento global." },

        { id: 12, cat: "ADMINISTRAÇÃO", q: "O dever do servidor público de prestar contas de seus atos e facilitar o acesso à informação refere-se à:", opts: ["Publicidade", "Hierarquia", "Sigilo"], corr: 0, exp: "O princípio da Publicidade garante que os atos do governo sejam transparentes para a população." },

        { id: 13, cat: "CIDADANIA", q: "Qual o documento fundamental que rege os direitos e deveres de todos os cidadãos brasileiros?", opts: ["Código Civil", "Constituição Federal", "Código Comercial"], corr: 1, exp: "A Constituição Federal de 1988 é a Lei Maior do nosso país." },
        { id: 14, cat: "PORTUGUÊS (MGS)", q: "Na frase: 'O vigilante agiu com rapidez', a palavra RAPIDEZ é um:", opts: ["Adjetivo", "Substantivo", "Verbo"], corr: 1, exp: "Rapidez é o NOME da característica, logo é um substantivo. 'Rápido' seria o adjetivo." },

        { id: 15, cat: "MATEMÁTICA (MGS)", q: "Se uma lâmpada do pátio consome 60W por hora, quanto ela consumirá em um turno de 12 horas?", opts: ["600W", "660W", "720W"], corr: 2, exp: "Conta simples: 60 x 12 = 720. A banca adora situações do dia a dia de trabalho." },

        { id: 16, cat: "CONHEC. GERAIS", q: "Qual o nome do atual Governador do Estado de Minas Gerais (sede da MGS)?", opts: ["Romeu Zema", "Alexandre Kalil", "Fernando Pimentel"], corr: 0, exp: "Romeu Zema é o atual governador. A MGS é uma estatal mineira, então isso cai direto." },

        { id: 17, cat: "ESPECÍFICO (VIGILÂNCIA)", q: "Ao realizar a ronda, o vigilante percebe uma janela quebrada. Qual a primeira atitude correta?", opts: ["Consertar a janela", "Anotar no livro de ocorrência e avisar o superior", "Ignorar se nada foi roubado"], corr: 1, exp: "A função principal é observar, zelar e COMUNICAR formalmente qualquer alteração no patrimônio." },

        { id: 18, cat: "INFORMÁTICA (IBFC)", q: "No Windows 10, qual comando de teclado alterna entre as janelas que estão abertas?", opts: ["Alt + Tab", "Ctrl + Alt + Del", "Windows + L"], corr: 0, exp: "Alt + Tab é o comando universal para alternar entre programas abertos rapidamente." },

        { id: 19, cat: "LEGISLAÇÃO", q: "Sobre a jornada 12x36, é correto afirmar que o trabalhador tem direito a:", opts: ["Nenhum intervalo para almoço", "Intervalo para repouso ou alimentação", "Folga de apenas 12 horas"], corr: 1, exp: "Mesmo na escala 12x36, o intervalo intrajornada (almoço/repouso) é um direito garantido." },
        { id: 20, cat: "PORTUGUÊS", q: "Qual a alternativa apresenta a grafia CORRETA da palavra?", opts: ["Excessão", "Exceção", "Esceção"], corr: 1, exp: "Exceção se escreve com 'XC' e 'Ç'. É uma das palavras que a IBFC mais usa para pegar candidatos." },

        { id: 21, cat: "PORTUGUÊS", q: "Na frase 'O funcionário solicitou o relatório', o termo 'O funcionário' é o:", opts: ["Objeto Direto", "Sujeito", "Verbo"], corr: 1, exp: "Sujeito é quem pratica a ação de solicitar." },

        { id: 22, cat: "MATEMÁTICA", q: "Um produto custa R$ 120,00 e sofre um desconto de 15%. Qual o valor final?", opts: ["R$ 102,00", "R$ 105,00", "R$ 108,00"], corr: 0, exp: "10% de 120 é 12. 5% é 6. Logo, 15% é 18. 120 - 18 = 102." },

        { id: 23, cat: "MATEMÁTICA", q: "Em uma caixa há 12 bolas brancas e 18 bolas pretas. Qual a razão entre brancas e o total?", opts: ["12/18", "12/30", "18/30"], corr: 1, exp: "A razão é a parte pelo todo. Total = 12+18=30. Logo, 12/30." },

        { id: 24, cat: "INFORMÁTICA", q: "No Windows, qual o atalho usado para RENOMEAR um arquivo selecionado?", opts: ["F2", "F5", "Ctrl + R"], corr: 0, exp: "A tecla F2 é o atalho padrão para renomear arquivos e pastas no Windows." },

        { id: 25, cat: "INFORMÁTICA", q: "O que significa a sigla WWW na internet?", opts: ["World Wide Web", "Web World Wide", "World Web Wide"], corr: 0, exp: "Significa Rede de Alcance Mundial (World Wide Web)." },

        { id: 26, cat: "CONH. GERAIS", q: "Onde se localiza a sede administrativa da MGS?", opts: ["Belo Horizonte", "Vila Velha", "São Paulo"], corr: 0, exp: "A MGS é uma empresa pública do Estado de Minas Gerais, sediada em BH." },

        { id: 27, cat: "CONH. GERAIS", q: "Qual o principal bioma do estado de Minas Gerais?", opts: ["Pampas", "Cerrado", "Caatinga"], corr: 1, exp: "O Cerrado é o bioma predominante e um dos mais cobrados em provas de Minas." },

        { id: 28, cat: "ADMINISTRAÇÃO", q: "O princípio da IMPESSOALIDADE na administração pública significa que:", opts: ["O agente pode favorecer amigos", "O tratamento deve ser igual para todos", "O agente deve ser famoso"], corr: 1, exp: "A administração deve tratar todos os cidadãos sem favoritismos ou perseguições." },

        { id: 29, cat: "MEIO AMBIENTE", q: "Qual o nome do processo de separação de materiais para reaproveitamento?", opts: ["Incineração", "Coleta Seletiva", "Aterro Sanitário"], corr: 1, exp: "A coleta seletiva permite que materiais como papel, plástico e vidro sejam reciclados." },

        { id: 30, cat: "SEGURANÇA DO TRABALHO", q: "O que significa a sigla EPI?", opts: ["Equipamento de Proteção Individual", "Exame de Proteção Interna", "Equipamento de Prevenção de Incêndio"], corr: 0, exp: "EPIs são fundamentais para a segurança do trabalhador (botas, luvas, capacetes)." },
        { id: 31, cat: "DIREITO PENAL (PRF)", q: "Sobre o crime de resistência, o que acontece se o ato não se executa em razão da resistência?", opts: ["A pena é reduzida", "A pena é aumentada", "Não há crime"], corr: 1, exp: "Art. 329 do CP: Se o ato não se executa, a pena é aumentada (resistência qualificada)." },

        { id: 32, cat: "TRÂNSITO (PRF)", q: "O condutor que for pego dirigindo sob influência de álcool comete infração:", opts: ["Grave", "Gravíssima", "Gravíssima com fator 10x"], corr: 2, exp: "Art. 165 do CTB: Infração gravíssima, multa 10x e suspensão do direito de dirigir por 12 meses." },

        { id: 33, cat: "DIREITO CONST. (PRF)", q: "A PRF é um órgão que integra a segurança pública e é destinada, na forma da lei, ao:", opts: ["Policiamento ostensivo ferroviário", "Policiamento ostensivo rodoviário", "Policiamento judiciário da União"], corr: 1, exp: "Art. 144 da CF: A PRF destina-se ao patrulhamento ostensivo das rodovias federais." },

        { id: 34, cat: "ÉTICA (PRF)", q: "O servidor público deve ser honesto não apenas porque a lei manda, mas por princípio. Isso se refere à:", opts: ["Cortesia", "Integridade/Moralidade", "Produtividade"], corr: 1, exp: "A ética no serviço público exige que o agente escolha sempre a opção mais honesta, não só a legal." },

        { id: 35, cat: "INFORMÁTICA (PRF)", q: "Um 'Ransomware' é um tipo de software malicioso que tem como objetivo principal:", opts: ["Acelerar o computador", "Sequestrar dados e cobrar resgate", "Apenas exibir anúncios"], corr: 1, exp: "Ransom = Resgate. O ransomware criptografa seus arquivos e exige dinheiro para liberá-los." },

        { id: 36, cat: "TRÂNSITO (PRF)", q: "Qual a idade mínima para uma criança ser transportada em MOTOCICLETA, segundo a nova lei?", opts: ["7 anos", "10 anos", "12 anos"], corr: 1, exp: "Nova regra do CTB: Proibido transportar menores de 10 anos em motocicletas." },

        { id: 37, cat: "DIREITO ADMIN. (PRF)", q: "O poder da administração de punir seus próprios servidores que cometem faltas é o poder:", opts: ["Poder Hierárquico", "Poder Disciplinar", "Poder de Polícia"], corr: 1, exp: "Poder Disciplinar é a faculdade de punir internamente as infrações funcionais." },

        { id: 38, cat: "FÍSICA (PRF)", q: "Em uma colisão, o uso do cinto de segurança impede que o passageiro seja lançado para frente devido à:", opts: ["Inércia", "Gravidade", "Aceleração centrípeta"], corr: 0, exp: "1ª Lei de Newton: A tendência de um corpo em movimento é continuar em movimento (Inércia)." },

        { id: 39, cat: "GEOPOLÍTICA (PRF)", q: "Qual rodovia federal é conhecida como 'Rodovia Transamazônica'?", opts: ["BR-101", "BR-116", "BR-230"], corr: 2, exp: "A BR-230 é a Transamazônica, cruzando o Brasil no sentido Leste-Oeste." },

        { id: 40, cat: "DIREITO PENAL (PRF)", q: "O crime de 'Prevaricação' ocorre quando o funcionário público retarda um ato de ofício para:", opts: ["Ajudar o Estado", "Satisfazer interesse ou sentimento pessoal", "Cumprir ordens superiores"], corr: 1, exp: "Art. 319 do CP: Prevaricar é deixar de fazer o dever para satisfazer o próprio 'ego' ou vontade." }
    ];

    function renderizar() {
        const div = document.getElementById('quiz');
        const agora = Date.now();
        let acertos = localStorage.getItem('acertos_dia') || 0;
        let totalRespostas = localStorage.getItem('total_tentativas') || 0;

        div.innerHTML = '';
        questoes.forEach((q) => {
            const lastTime = localStorage.getItem(`bloqueio_${q.id}`);
            const isBloqueado = lastTime && (agora - lastTime < COOLDOWN_HOURS * 3600000);
            
            div.innerHTML += `
                <div class="questao ${isBloqueado ? 'bloqueado' : ''}" id="q-box-${q.id}">
                    <span class="badge">${q.cat}</span>
                    <div>${q.q}</div>
                    <div class="timer-msg">⏳ Bloqueada por 4h após resposta.</div>
                    ${q.opts.map((opt, i) => `<button class="opcao" onclick="verificar(${q.id}, ${i})">${opt}</button>`).join('')}
                </div>
            `;
        });
        atualizarStats();
    }

    function verificar(qId, optIdx) {
        const q = questoes.find(x => x.id === qId);
        let acertos = parseInt(localStorage.getItem('acertos_dia') || 0);
        let total = parseInt(localStorage.getItem('total_tentativas') || 0);

        localStorage.setItem(`bloqueio_${qId}`, Date.now());
        localStorage.setItem('total_tentativas', total + 1);

        if (optIdx === q.corr) {
            localStorage.setItem('acertos_dia', acertos + 1);
            Swal.fire({ title: 'Boa!', text: q.exp, icon: 'success' }).then(renderizar);
        } else {
            Swal.fire({ title: 'Errou!', text: 'Resposta certa: ' + q.opts[q.corr], icon: 'error' }).then(renderizar);
        }
    }

    function atualizarStats() {
        const acertos = localStorage.getItem('acertos_dia') || 0;
        const total = localStorage.getItem('total_tentativas') || 1;
        document.getElementById('total-hoje').innerText = acertos;
        document.getElementById('percentual').innerText = Math.round((acertos / total) * 100) + '%';
    }

    renderizar();
</script>
</body>
</html>
