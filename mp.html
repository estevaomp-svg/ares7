   <script>
    // 1. CONFIGURAÇÃO DO TEMPO (4 HORAS)
    const TEMPO_BLOQUEIO = 4 * 60 * 60 * 1000; 

    function renderizar() {

        const container = document.getElementById('quiz-container');

        container.innerHTML = '';

        let currentCat = "";

        questoes.forEach(q => {

            if(q.cat !== currentCat) {

                currentCat = q.cat;

                container.innerHTML += `<div class="modulo-title">${currentCat}</div>`;

            }

            const respondida = localStorage.getItem(`mpes_q_${q.id}`);

            const div = document.createElement('div');

            div.className = `questao ${respondida ? 'bloqueado' : ''}`;

            div.innerHTML = `

                <span class="badge ${q.mod === 1 ? 'cat-basic' : 'cat-especific'}">${q.cat} (Peso ${q.mod === 1 ? '1.0' : '1.5'})</span>

                <p><b>${q.id}.</b> ${q.q}</p>

                ${q.opts.map((opt, i) => `<button class="opcao" onclick="verificar(${q.id}, ${i})">${opt}</button>`).join('')}

            `;

            container.appendChild(div);

        });

        atualizarStats();

    }



    function verificar(id, opt) {

        const q = questoes.find(x => x.id === id);

        let pontos = parseFloat(localStorage.getItem('mpes_pontos') || 0);

        let acertos = parseInt(localStorage.getItem('mpes_acertos') || 0);

        let resp = parseInt(localStorage.getItem('mpes_resp') || 0);

        localStorage.setItem(`mpes_q_${id}`, "true");

        localStorage.setItem('mpes_resp', resp + 1);

        if(opt === q.corr) {

            localStorage.setItem('mpes_pontos', pontos + (q.mod === 1 ? 1.0 : 1.5));

            localStorage.setItem('mpes_acertos', acertos + 1);

            Swal.fire({ title: 'Acertou!', text: q.exp, icon: 'success' });

        } else {

            Swal.fire({ title: 'Errou!', text: `A resposta certa era: ${q.opts[q.corr]}`, icon: 'error' });

        }

        renderizar();

    }



    function atualizarStats() {

        const pontos = parseFloat(localStorage.getItem('mpes_pontos') || 0);

        const acertos = parseInt(localStorage.getItem('mpes_acertos') || 0);

        const resp = parseInt(localStorage.getItem('mpes_resp') || 0);

        document.getElementById('score').innerText = pontos.toFixed(1);

        document.getElementById('acertos').innerText = `${acertos}/60`;

        document.getElementById('percent').innerText = resp > 0 ? Math.round((acertos/resp)*100) + '%' : '0%';

    }

    renderizar();

</script>

</body>

</html>
