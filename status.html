<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ares RPG - Status</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <style>
        :root { --primary: #3b82f6; --accent: #a855f7; --bg: #0f172a; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: #fff; margin: 0; padding: 15px; }
        .container { max-width: 500px; margin: auto; }
        .card { background: rgba(30, 41, 59, 0.9); padding: 15px; border-radius: 12px; border: 1px solid #334155; text-align: center; margin-bottom: 10px; }
        .nickname { font-size: 24px; font-weight: bold; color: gold; }
        .val { font-size: 22px; font-weight: bold; display: block; }
        .label { font-size: 10px; color: #94a3b8; text-transform: uppercase; }
        .progress-box { background: #1e293b; height: 10px; border-radius: 5px; margin-top: 5px; overflow: hidden; }
        .bar { height: 100%; width: 0%; transition: 1s ease; }
        .btn-voltar { width: 100%; padding: 15px; background: #334155; color: white; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <div class="nickname" id="n">---</div>
        <div id="l" style="color: var(--primary); font-weight: bold; font-size: 22px;">LV --</div>
        <div class="progress-box"><div id="pb" class="bar" style="background: var(--accent);"></div></div>
        <div id="x" style="font-size: 12px; margin-top: 5px;">XP: --</div>
    </div>

    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
        <div class="card"><span class="val" id="m" style="color: gold;">0</span><span class="label">Moedas</span></div>
        <div class="card"><span class="val" id="bf" style="color: #ec4899;">--%</span><span class="label">B.F.</span></div>
    </div>

    <div class="card">
        <span class="label" style="color: #ef4444;">Força & Defesa</span>
        <span class="val" id="fd">0</span>
        <div class="progress-box"><div id="pfd" class="bar" style="background: #ef4444;"></div></div>
    </div>

    <div class="card">
        <span class="label" style="color: #22c55e;">Stamina</span>
        <span class="val" id="st">0</span>
        <div class="progress-box"><div id="pst" class="bar" style="background: #22c55e;"></div></div>
    </div>

    <div class="card">
        <span class="label" style="color: #eab308;">Inteligência</span>
        <span class="val" id="it">0</span>
        <div class="progress-box"><div id="pit" class="bar" style="background: #eab308;"></div></div>
    </div>

    <button class="btn-voltar" onclick="location.href='index.html'">VOLTAR</button>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyBanevR51ejaTE0ccqlmlU6VRh7Qg4EETs",
        authDomain: "aresrpg-7daf4.firebaseapp.com",
        databaseURL: "https://aresrpg-7daf4-default-rtdb.firebaseio.com",
        projectId: "aresrpg-7daf4",
        storageBucket: "aresrpg-7daf4.firebasestorage.app",
        messagingSenderId: "153757603214",
        appId: "1:153757603214:web:fb572985353c8fad7f80df"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    firebase.auth().onAuthStateChanged(user => {
        if (user) {
            let id = user.email.split('@')[0].replace(/[.#$[\]]/g, "_");
            db.ref('rpg_data/' + id).on('value', snap => {
                const d = snap.val() || {};
                const r = d.records || {};

                // MOEDAS E XP (Idêntico ao index.html)
                document.getElementById('n').innerText = d.nick || "Herói";
                document.getElementById('m').innerText = d.moedas || 0;
                
                let xp = parseInt(d.xp) || 0;
                let lv = Math.floor(xp / 1000); // 1000 de XP por Level
                let progresso = (xp % 1000) / 10; // porcentagem de 0 a 1000

                document.getElementById('l').innerText = "LV " + lv;
                document.getElementById('x').innerText = "XP: " + xp;
                document.getElementById('pb').style.width = progresso + "%";

                // CÁLCULO MANUAL DO BF (Pois o bioestatistica não salva o BF final)
                if (r.cintura && r.pescoco && r.altura) {
                    let bfCalc = (495 / (1.0324 - 0.19077 * Math.log10(r.cintura - r.pescoco) + 0.15456 * Math.log10(r.altura))) - 450;
                    document.getElementById('bf').innerText = bfCalc.toFixed(1) + "%";
                } else {
                    document.getElementById('bf').innerText = "--%";
                }

                // FORÇA & DEFESA (Soma campos de peso)
                let f = (parseFloat(r.supino) || 0) + (parseFloat(r.legpress) || 0) + 
                        (parseFloat(r.remada) || 0) + (parseFloat(r.desenvolvimento) || 0) + 
                        (parseFloat(r.terra) || 0) + (parseFloat(r.rosca) || 0) +
                        (parseFloat(r.agachamento) || 0) + (parseFloat(r.flexao) || 0) + 
                        (parseFloat(r.barra) || 0) + (parseFloat(r.mergulho) || 0);
                
                document.getElementById('fd').innerText = f.toFixed(1);
                document.getElementById('pfd').style.width = Math.min((f / 1500) * 100, 100) + "%";

                // STAMINA (Cardio)
                let s = (parseFloat(r.corrida) || 0) + (parseFloat(r.cardio) || 0) + (parseFloat(r.natacao) || 0);
                document.getElementById('st').innerText = s.toFixed(1);
                document.getElementById('pst').style.width = Math.min((s / 500) * 100, 100) + "%";

                // INTELIGÊNCIA (Soma de atividades registradas no index.html)
                let intel = (parseInt(d.missoesExecutadas) || 0) + (parseInt(d.missoesDiarias) || 0);
                document.getElementById('it').innerText = intel;
                document.getElementById('pit').style.width = Math.min((intel / 100) * 100, 100) + "%";
            });
        }
    });
</script>
</body>
</html>
