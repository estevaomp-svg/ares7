<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ares RPG - Status do Herói</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --primary: #3b82f6; --accent: #a855f7; --bg: #0f172a; --card-bg: rgba(30, 41, 59, 0.9); }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: #fff; margin: 0; padding: 15px; }
        .container { max-width: 500px; margin: auto; }
        .header { text-align: center; padding: 20px; background: var(--card-bg); border-radius: 15px; margin-bottom: 20px; border: 1px solid #334155; }
        .nickname { font-size: 26px; font-weight: bold; color: gold; }
        .status-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .card { background: var(--card-bg); padding: 15px; border-radius: 12px; border: 1px solid #334155; text-align: center; }
        .val { font-size: 22px; font-weight: bold; display: block; }
        .label { font-size: 11px; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px; }
        .progress-box { background: #1e293b; height: 8px; border-radius: 4px; margin-top: 8px; overflow: hidden; }
        .bar { height: 100%; width: 0%; transition: 1.5s ease-in-out; }
        .full-card { grid-column: span 2; }
        .btn-voltar { width: 100%; padding: 15px; margin-top: 20px; border-radius: 10px; border: none; background: #334155; color: white; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="nickname" id="nick">---</div>
        <div id="level-tag" style="color: var(--primary); font-weight: bold; margin-top: 5px;">LEVEL 1</div>
        <div class="progress-box" style="height: 12px;"><div id="xp-bar" class="bar" style="background: var(--accent);"></div></div>
        <div id="xp-text" style="font-size: 12px; margin-top: 5px;">XP: 0 / 100</div>
    </div>

    <div class="status-grid">
        <div class="card"><span class="val" id="moedas" style="color: gold;">0</span><span class="label">Moedas</span></div>
        <div class="card"><span class="val" id="bf" style="color: #ec4899;">--%</span><span class="label">B.F.</span></div>

        <div class="card full-card">
            <i class="fas fa-dumbbell" style="color: #ef4444;"></i>
            <span class="label">Força (Poder Ofensivo)</span>
            <span class="val" id="forca" style="color: #ef4444;">0</span>
            <div class="progress-box"><div id="bar-forca" class="bar" style="background: #ef4444;"></div></div>
        </div>

        <div class="card full-card">
            <i class="fas fa-shield-alt" style="color: #3b82f6;"></i>
            <span class="label">Defesa (Resistência Corporal)</span>
            <span class="val" id="defesa" style="color: #3b82f6;">0</span>
            <div class="progress-box"><div id="bar-defesa" class="bar" style="background: #3b82f6;"></div></div>
        </div>

        <div class="card full-card">
            <i class="fas fa-bolt" style="color: #22c55e;"></i>
            <span class="label">Stamina (Fôlego/Cardio)</span>
            <span class="val" id="stamina" style="color: #22c55e;">0</span>
            <div class="progress-box"><div id="bar-stamina" class="bar" style="background: #22c55e;"></div></div>
        </div>

        <div class="card full-card">
            <i class="fas fa-brain" style="color: #eab308;"></i>
            <span class="label">Inteligência (Missões/Uso)</span>
            <span class="val" id="intel" style="color: #eab308;">0</span>
            <div class="progress-box"><div id="bar-intel" class="bar" style="background: #eab308;"></div></div>
        </div>
    </div>

    <button class="btn-voltar" onclick="location.href='index.html'">VOLTAR AO MENU</button>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyBanevR51ejaTE0ccqlmlU6VRh7Qg4EETs",
        authDomain: "aresrpg-7daf4.firebaseapp.com",
        databaseURL: "https://aresrpg-7daf4-default-rtdb.firebaseio.com",
        projectId: "aresrpg-7daf4",
        storageBucket: "aresrpg-7daf4.firebasestorage.app",
        messagingSenderId: "153757603214",
        appId: "1:153757603214:web:fb572985353c8fad7f80df"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    firebase.auth().onAuthStateChanged(user => {
        if (user) {
            let id = user.email.split('@')[0].replace(/[.#$[\]]/g, "_");
            db.ref('rpg_data/' + id).on('value', snap => {
                const d = snap.val() || {};
                const r = d.records || {};

                document.getElementById('nick').innerText = d.nick || "Herói";
                document.getElementById('moedas').innerText = d.moedas || 0;
                document.getElementById('bf').innerText = d.bf ? d.bf + "%" : "--%";

                // XP e LEVEL
                let xp = d.xp || 0;
                let level = Math.floor(Math.sqrt(xp / 100)) + 1;
                let nextXp = Math.pow(level, 2) * 100;
                document.getElementById('level-tag').innerText = "LEVEL " + level;
                document.getElementById('xp-text').innerText = `XP: ${xp} / ${nextXp}`;
                document.getElementById('xp-bar').style.width = (xp / nextXp * 100) + "%";

                // CÁLCULO UNIFICADO: FORÇA E DEFESA
                // Soma Kg (musculação) + Reps (calistenia)
                let muscular = (parseFloat(r.supino) || 0) + (parseFloat(r.legpress) || 0) + 
                               (parseFloat(r.remada) || 0) + (parseFloat(r.desenvolvimento) || 0) + 
                               (parseFloat(r.terra) || 0) + (parseFloat(r.rosca) || 0) +
                               (parseFloat(r.agachamento) || 0) + (parseFloat(r.flexao) || 0) + 
                               (parseFloat(r.barra) || 0) + (parseFloat(r.mergulho) || 0);
                
                atualizarAtributo('forca', muscular, 2000);
                atualizarAtributo('defesa', muscular, 2000);

                // STAMINA: Apenas os cardios da página
                let stamina = (parseFloat(r.corrida) || 0) + (parseFloat(r.cardio) || 0) + (parseFloat(r.natacao) || 0);
                atualizarAtributo('stamina', stamina, 500);

                // INTELIGÊNCIA: Missões e Atividades Extras
                let intel = (d.missoesExecutadas || 0) + (d.missoesDiarias || 0) + 
                            (d.usoPenalidade || 0) + (d.usoLoja || 0);
                atualizarAtributo('intel', intel, 150);
            });
        }
    });

    function atualizarAtributo(id, val, meta) {
        document.getElementById(id).innerText = val;
        let p = Math.min((val / meta) * 100, 100);
        document.getElementById('bar-' + id).style.width = p + "%";
    }
</script>
</body>
</html>
