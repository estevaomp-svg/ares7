<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ares RPG - Status</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <style>
        :root { --primary: #3b82f6; --accent: #a855f7; --bg: #0f172a; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: #fff; margin: 0; padding: 15px; }
        .container { max-width: 500px; margin: auto; }
        .card { background: rgba(30, 41, 59, 0.9); padding: 15px; border-radius: 12px; border: 1px solid #334155; text-align: center; margin-bottom: 10px; }
        .nickname { font-size: 24px; font-weight: bold; color: gold; }
        .val { font-size: 22px; font-weight: bold; display: block; }
        .label { font-size: 10px; color: #94a3b8; text-transform: uppercase; }
        .progress-box { background: #1e293b; height: 10px; border-radius: 5px; margin-top: 5px; overflow: hidden; }
        .bar { height: 100%; width: 0%; transition: 1s ease; }
        .btn-voltar { width: 100%; padding: 15px; background: var(--primary); color: white; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <div class="nickname" id="nick">---</div>
        <div id="lv-text" style="color: var(--primary); font-weight: bold; font-size: 20px;">LV --</div>
        <div class="progress-box"><div id="xp-bar" class="bar" style="background: var(--accent);"></div></div>
        <div id="xp-display" style="font-size: 12px; margin-top: 5px;">XP: --</div>
    </div>

    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
        <div class="card"><span class="val" id="moedas" style="color: gold;">0</span><span class="label">Moedas</span></div>
        <div class="card"><span class="val" id="bf" style="color: #ec4899;">--%</span><span class="label">B.F.</span></div>
    </div>

    <div class="card">
        <span class="label" style="color: #ef4444;">Força & Defesa</span>
        <span class="val" id="muscular" style="color: #ef4444;">0</span>
        <div class="progress-box"><div id="bar-muscular" class="bar" style="background: #ef4444;"></div></div>
    </div>

    <div class="card">
        <span class="label" style="color: #22c55e;">Stamina (Cardio)</span>
        <span class="val" id="stamina" style="color: #22c55e;">0</span>
        <div class="progress-box"><div id="bar-stamina" class="bar" style="background: #22c55e;"></div></div>
    </div>

    <div class="card">
        <span class="label" style="color: #eab308;">Inteligência</span>
        <span class="val" id="intel" style="color: #eab308;">0</span>
        <div class="progress-box"><div id="bar-intel" class="bar" style="background: #eab308;"></div></div>
    </div>

    <button class="btn-voltar" onclick="location.href='index.html'">VOLTAR</button>
</div>

<script>
    // Configuração idêntica aos teus ficheiros
    const firebaseConfig = {
        apiKey: "AIzaSyBanevR51ejaTE0ccqlmlU6VRh7Qg4EETs",
        authDomain: "aresrpg-7daf4.firebaseapp.com",
        databaseURL: "https://aresrpg-7daf4-default-rtdb.firebaseio.com",
        projectId: "aresrpg-7daf4",
        storageBucket: "aresrpg-7daf4.firebasestorage.app",
        messagingSenderId: "153757603214",
        appId: "1:153757603214:web:fb572985353c8fad7f80df"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    firebase.auth().onAuthStateChanged(user => {
        if (user) {
            let id = user.email.split('@')[0].replace(/[.#$[\]]/g, "_");
            db.ref('rpg_data/' + id).on('value', snap => {
                const d = snap.val() || {};
                const r = d.records || {};

                // 1. LV E MOEDAS (IGUAL AO INDEX)
                document.getElementById('nick').innerText = d.nick || "Herói";
                document.getElementById('moedas').innerText = d.moedas || 0;
                
                let xp = parseInt(d.xp) || 0;
                // A lógica exata do teu index.html para o LV 72
                let lv = Math.floor(xp / 100) + 1; 
                document.getElementById('lv-text').innerText = "LV " + lv;
                document.getElementById('xp-display').innerText = "XP: " + xp + " / " + (lv * 100);
                document.getElementById('xp-bar').style.width = (xp % 100) + "%";

                // 2. BF (PUXA DA EVOLUÇÃO FÍSICA)
                document.getElementById('bf').innerText = r.bf ? r.bf + "%" : "--%";

                // 3. FORÇA & DEFESA (SOMA KG + REPETIÇÃO)
                let muscular = (parseFloat(r.supino) || 0) + (parseFloat(r.legpress) || 0) + 
                               (parseFloat(r.remada) || 0) + (parseFloat(r.desenvolvimento) || 0) + 
                               (parseFloat(r.terra) || 0) + (parseFloat(r.rosca) || 0) +
                               (parseFloat(r.agachamento) || 0) + (parseFloat(r.flexao) || 0) + 
                               (parseFloat(r.barra) || 0) + (parseFloat(r.mergulho) || 0);
                
                document.getElementById('muscular').innerText = muscular;
                document.getElementById('bar-muscular').style.width = Math.min((muscular / 1000) * 100, 100) + "%";

                // 4. STAMINA (CARDIO)
                let stamina = (parseFloat(r.corrida) || 0) + (parseFloat(r.cardio) || 0) + (parseFloat(r.natacao) || 0);
                document.getElementById('stamina').innerText = stamina;
                document.getElementById('bar-stamina').style.width = Math.min((stamina / 500) * 100, 100) + "%";

                // 5. INTELIGÊNCIA
                let intel = (parseInt(d.missoesExecutadas) || 0) + (parseInt(d.missoesDiarias) || 0) + 
                            (parseInt(d.usoPenalidade) || 0) + (parseInt(d.usoLoja) || 0);
                document.getElementById('intel').innerText = intel;
                document.getElementById('bar-intel').style.width = Math.min((intel / 100) * 100, 100) + "%";
            });
        }
    });
</script>
</body>
</html>
