<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ares RPG - Status</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --primary: #3b82f6; --accent: #a855f7; --bg: #0f172a; --card-bg: rgba(30, 41, 59, 0.9); }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: #fff; margin: 0; padding: 15px; }
        .container { max-width: 500px; margin: auto; }
        .header { text-align: center; padding: 20px; background: var(--card-bg); border-radius: 15px; margin-bottom: 20px; border: 1px solid #334155; }
        .nickname { font-size: 24px; font-weight: bold; color: gold; margin-bottom: 5px; }
        .status-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .card { background: var(--card-bg); padding: 15px; border-radius: 12px; border: 1px solid #334155; text-align: center; }
        .val { font-size: 20px; font-weight: bold; display: block; }
        .label { font-size: 10px; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px; }
        .progress-box { background: #1e293b; height: 10px; border-radius: 5px; margin-top: 8px; overflow: hidden; }
        .bar { height: 100%; width: 0%; transition: 1s ease; }
        .full-card { grid-column: span 2; }
        .btn-voltar { width: 100%; padding: 15px; margin-top: 20px; border-radius: 10px; border: none; background: #3b82f6; color: white; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="nickname" id="display-nick">---</div>
        <div id="display-lv" style="color: var(--primary); font-weight: bold; font-size: 18px;">LV --</div>
        <div class="progress-box"><div id="display-xp-bar" class="bar" style="background: var(--accent);"></div></div>
        <div id="display-xp-text" style="font-size: 12px; margin-top: 5px;">XP: -- / --</div>
    </div>

    <div class="status-grid">
        <div class="card"><span class="val" id="display-moedas" style="color: gold;">0</span><span class="label">Moedas</span></div>
        
        <div class="card"><span class="val" id="display-bf" style="color: #ec4899;">--%</span><span class="label">B.F.</span></div>

        <div class="card full-card">
            <span class="label" style="color: #ef4444;">Força & Defesa</span>
            <span class="val" id="val-muscular">0</span>
            <div class="progress-box"><div id="bar-muscular" class="bar" style="background: #ef4444;"></div></div>
        </div>

        <div class="card full-card">
            <span class="label" style="color: #22c55e;">Stamina</span>
            <span class="val" id="val-stamina">0</span>
            <div class="progress-box"><div id="bar-stamina" class="bar" style="background: #22c55e;"></div></div>
        </div>

        <div class="card full-card">
            <span class="label" style="color: #eab308;">Inteligência</span>
            <span class="val" id="val-intel">0</span>
            <div class="progress-box"><div id="bar-intel" class="bar" style="background: #eab308;"></div></div>
        </div>
    </div>

    <button class="btn-voltar" onclick="location.href='index.html'">VOLTAR</button>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyBanevR51ejaTE0ccqlmlU6VRh7Qg4EETs",
        authDomain: "aresrpg-7daf4.firebaseapp.com",
        databaseURL: "https://aresrpg-7daf4-default-rtdb.firebaseio.com",
        projectId: "aresrpg-7daf4",
        storageBucket: "aresrpg-7daf4.firebasestorage.app",
        messagingSenderId: "153757603214",
        appId: "1:153757603214:web:fb572985353c8fad7f80df"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    firebase.auth().onAuthStateChanged(user => {
        if (user) {
            let id = user.email.split('@')[0].replace(/[.#$[\]]/g, "_");
            db.ref('rpg_data/' + id).on('value', snap => {
                const data = snap.val() || {};
                const rec = data.records || {};

                // 1. REPETIR O QUE JÁ EXISTE NO INDEX (SEM CÁLCULOS NOVOS)
                document.getElementById('display-nick').innerText = data.nick || "Herói";
                document.getElementById('display-moedas').innerText = data.moedas || 0;
                
                let xp = parseInt(data.xp) || 0;
                let lv = Math.floor(xp / 100) + 1;
                document.getElementById('display-lv').innerText = "LV " + lv;
                document.getElementById('display-xp-text').innerText = "XP: " + xp + " / " + (lv * 100);
                document.getElementById('display-xp-bar').style.width = (xp % 100) + "%";

                // 2. BF (Puxando de records.bf conforme sua página de evolução)
                document.getElementById('display-bf').innerText = rec.bf ? rec.bf + "%" : "--%";

                // 3. CÁLCULO DE FORÇA E DEFESA (Musculação + Calistenia)
                let totalMuscular = 
                    (parseFloat(rec.supino) || 0) + (parseFloat(rec.legpress) || 0) + 
                    (parseFloat(rec.remada) || 0) + (parseFloat(rec.desenvolvimento) || 0) + 
                    (parseFloat(rec.terra) || 0) + (parseFloat(rec.rosca) || 0) +
                    (parseFloat(rec.agachamento) || 0) + (parseFloat(rec.flexao) || 0) + 
                    (parseFloat(rec.barra) || 0) + (parseFloat(rec.mergulho) || 0);
                
                document.getElementById('val-muscular').innerText = totalMuscular;
                document.getElementById('bar-muscular').style.width = Math.min((totalMuscular / 2000) * 100, 100) + "%";

                // 4. CÁLCULO DE STAMINA (Cardios)
                let totalStamina = (parseFloat(rec.corrida) || 0) + (parseFloat(rec.cardio) || 0) + (parseFloat(rec.natacao) || 0);
                document.getElementById('val-stamina').innerText = totalStamina;
                document.getElementById('bar-stamina').style.width = Math.min((totalStamina / 500) * 100, 100) + "%";

                // 5. CÁLCULO DE INTELIGÊNCIA (Missões e Usos)
                let totalIntel = (parseInt(data.missoesExecutadas) || 0) + (parseInt(data.missoesDiarias) || 0) + 
                                 (parseInt(data.usoPenalidade) || 0) + (parseInt(data.usoLoja) || 0);
                document.getElementById('val-intel').innerText = totalIntel;
                document.getElementById('bar-intel').style.width = Math.min((totalIntel / 100) * 100, 100) + "%";
            });
        }
    });
</script>
</body>
</html>
