<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ares RPG - Status do Herói</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --primary: #3b82f6; --accent: #a855f7; --bg: #0f172a; --card-bg: rgba(30, 41, 59, 0.9); }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: #fff; margin: 0; padding: 15px; }
        .container { max-width: 500px; margin: auto; }
        .header { text-align: center; padding: 20px; background: var(--card-bg); border-radius: 15px; margin-bottom: 20px; border: 1px solid #334155; }
        .nickname { font-size: 26px; font-weight: bold; color: gold; text-transform: uppercase; }
        .status-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .card { background: var(--card-bg); padding: 15px; border-radius: 12px; border: 1px solid #334155; text-align: center; }
        .val { font-size: 22px; font-weight: bold; display: block; }
        .label { font-size: 11px; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px; }
        .progress-box { background: #1e293b; height: 10px; border-radius: 5px; margin-top: 8px; overflow: hidden; }
        .bar { height: 100%; width: 0%; transition: 1.5s ease-in-out; }
        .full-card { grid-column: span 2; }
        .btn-voltar { width: 100%; padding: 15px; margin-top: 20px; border-radius: 10px; border: none; background: #3b82f6; color: white; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="nickname" id="nick">---</div>
        <div id="level-tag" style="color: var(--primary); font-weight: bold; margin-top: 5px; font-size: 22px;">LV --</div>
        <div class="progress-box" style="height: 12px;"><div id="xp-bar" class="bar" style="background: var(--accent);"></div></div>
        <div id="xp-text" style="font-size: 13px; margin-top: 5px; font-weight: bold;">XP: --</div>
    </div>

    <div class="status-grid">
        <div class="card"><span class="val" id="moedas" style="color: gold;">0</span><span class="label">Moedas</span></div>
        <div class="card"><span class="val" id="bf" style="color: #ec4899;">--%</span><span class="label">B.F. Corporal</span></div>

        <div class="card full-card">
            <i class="fas fa-dumbbell" style="color: #ef4444;"></i>
            <span class="label">Força & Defesa (Poder Físico)</span>
            <span class="val" id="muscular" style="color: #ef4444;">0</span>
            <div class="progress-box"><div id="bar-muscular" class="bar" style="background: #ef4444;"></div></div>
        </div>

        <div class="card full-card">
            <i class="fas fa-bolt" style="color: #22c55e;"></i>
            <span class="label">Stamina (Resistência)</span>
            <span class="val" id="stamina" style="color: #22c55e;">0</span>
            <div class="progress-box"><div id="bar-stamina" class="bar" style="background: #22c55e;"></div></div>
        </div>

        <div class="card full-card">
            <i class="fas fa-brain" style="color: #eab308;"></i>
            <span class="label">Inteligência (Missões/Uso)</span>
            <span class="val" id="intel" style="color: #eab308;">0</span>
            <div class="progress-box"><div id="bar-intel" class="bar" style="background: #eab308;"></div></div>
        </div>
    </div>

    <button class="btn-voltar" onclick="location.href='index.html'">VOLTAR AO INÍCIO</button>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyBanevR51ejaTE0ccqlmlU6VRh7Qg4EETs",
        authDomain: "aresrpg-7daf4.firebaseapp.com",
        databaseURL: "https://aresrpg-7daf4-default-rtdb.firebaseio.com",
        projectId: "aresrpg-7daf4",
        storageBucket: "aresrpg-7daf4.firebasestorage.app",
        messagingSenderId: "153757603214",
        appId: "1:153757603214:web:fb572985353c8fad7f80df"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    firebase.auth().onAuthStateChanged(user => {
        if (user) {
            let id = user.email.split('@')[0].replace(/[.#$[\]]/g, "_");
            db.ref('rpg_data/' + id).on('value', snap => {
                const d = snap.val() || {};
                const r = d.records || {};

                // 1. SINCRONIZAÇÃO DIRETA (REPETE O INDEX)
                document.getElementById('nick').innerText = d.nick || "Herói";
                document.getElementById('moedas').innerText = d.moedas || 0;
                
                // Puxa o XP bruto e calcula o LV exatamente como o seu index faz
                let xp = parseInt(d.xp) || 0;
                let level = Math.floor(xp / 100) + 1; 
                
                document.getElementById('level-tag').innerText = "LV " + level;
                document.getElementById('xp-text').innerText = "XP TOTAL: " + xp;
                document.getElementById('xp-bar').style.width = (xp % 100) + "%";

                // 2. BF (Puxa do que foi salvo no evolucaofisica.html)
                document.getElementById('bf').innerText = r.bf ? r.bf + "%" : "--%";

                // 3. FORÇA E DEFESA (Soma total dos exercícios da sua página)
                let forcaDefesa = (parseFloat(r.supino) || 0) + (parseFloat(r.legpress) || 0) + 
                                  (parseFloat(r.remada) || 0) + (parseFloat(r.desenvolvimento) || 0) + 
                                  (parseFloat(r.terra) || 0) + (parseFloat(r.rosca) || 0) +
                                  (parseFloat(r.agachamento) || 0) + (parseFloat(r.flexao) || 0) + 
                                  (parseFloat(r.barra) || 0) + (parseFloat(r.mergulho) || 0);
                
                document.getElementById('muscular').innerText = forcaDefesa;
                document.getElementById('bar-muscular').style.width = Math.min((forcaDefesa / 1000) * 100, 100) + "%";

                // 4. STAMINA (Corrida, Cardio, Natação)
                let stamina = (parseFloat(r.corrida) || 0) + (parseFloat(r.cardio) || 0) + (parseFloat(r.natacao) || 0);
                document.getElementById('stamina').innerText = stamina;
                document.getElementById('bar-stamina').style.width = Math.min((stamina / 500) * 100, 100) + "%";

                // 5. INTELIGÊNCIA (Missões, Penalidade e Loja)
                let intel = (parseInt(d.missoesExecutadas) || 0) + (parseInt(d.missoesDiarias) || 0) + 
                            (parseInt(d.usoPenalidade) || 0) + (parseInt(d.usoLoja) || 0);
                document.getElementById('intel').innerText = intel;
                document.getElementById('bar-intel').style.width = Math.min((intel / 100) * 100, 100) + "%";
            });
        }
    });
</script>
</body>
</html>
