<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ares RPG - Investimento</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --primary: #3b82f6; --success: #22c55e; --danger: #ef4444; --bg: #0f172a; --card: #1e293b; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: white; padding: 15px; margin: 0; }
        .container { max-width: 800px; margin: auto; }
        .card { background: var(--card); padding: 20px; border-radius: 15px; margin-bottom: 20px; border: 1px solid #334155; }
        .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        .stat-box { background: #0f172a; padding: 15px; border-radius: 10px; text-align: center; border: 1px solid #475569; }
        .stat-box strong { font-size: 1.1rem; display: block; margin-top: 5px; }
        input { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: white; box-sizing: border-box; }
        .btn-group { display: flex; gap: 10px; margin-top: 10px; }
        button { flex: 1; padding: 12px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; color: white; transition: 0.2s; }
        .btn-main { background: var(--primary); }
        .btn-danger { background: var(--danger); }
        button:hover { opacity: 0.8; }
        .gain { color: var(--success); }
        .loss { color: var(--danger); }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 0.85rem; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid #334155; }
        .user-info { text-align: right; font-size: 0.9rem; margin-bottom: 10px; color: #fbbf24; font-weight: bold; }
        #grafico-container { position: relative; height: 200px; width: 100%; }
    </style>
</head>
<body>

<div class="container">
    <button onclick="window.location.href='./'" style="background: #475569; width: auto; padding: 10px 20px; margin-bottom: 15px; border-radius: 8px; border: none; cursor: pointer; display: block; color: white;">
        ⬅ Voltar para o Ares RPG
    </button>
    
    <div id="user-display" class="user-info">Carregando...</div>
    
    <div class="card">
        <h2>🚀 Investimento Trade GR</h2>
        <div class="grid-3">
            <div class="stat-box">
                <small id="label-meta">Meta (0%)</small>
                <strong id="meta-valor" class="gain">R$ 0,00</strong>
            </div>
            <div class="stat-box">
                <small>Contratos</small>
                <strong id="contratos-qtd" style="color: #fbbf24;">0</strong>
            </div>
            <div class="stat-box">
                <small id="label-loss">Loss Diário (0%)</small>
                <strong id="loss-limite" class="loss">R$ 0,00</strong>
            </div>
        </div>
    </div>

    <div class="card">
        <h3>📈 Evolução do Capital</h3>
        <div id="grafico-container">
            <canvas id="graficoEvolucao"></canvas>
        </div>
    </div>

    <div class="card">
        <h3>⚙️ Registro de Operação</h3>
        <label>Data da Operação:</label>
        <input type="date" id="data-operacao"> 
        
        <label>Sua Meta Diária (%):</label>
        <input type="number" id="porcentagem-meta" value="10" onchange="salvarPreferenciaMeta()" oninput="atualizarCalculos()">

        <label id="label-resultado">Resultado Financeiro (R$):</label>
        <input type="number" id="resultado-input" placeholder="Ex: 100 ou -50">
        
        <input type="hidden" id="capital-input">

        <div class="btn-group">
            <button class="btn-main" id="btn-salvar" onclick="salvarOperacao()">REGISTRAR</button>
            <button class="btn-danger" onclick="apagarUltimo()">CORRIGIR ÚLTIMO</button>
        </div>
        <p id="aviso-inicial" style="font-size: 0.8rem; color: #94a3b8; margin-top: 10px; display: none;">
            ℹ️ O primeiro registro será seu <strong>Capital Inicial</strong>.
        </p>
    </div>

    <div class="card">
        <h3>📊 Histórico</h3>
        <div style="overflow-x:auto;">
            <table>
                <thead>
                    <tr><th>Data</th><th>Resultado</th><th>Capital Acumulado</th></tr>
                </thead>
                <tbody id="tabela-corpo"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyBanevR51ejaTE0ccqlmlU6VRh7Qg4EETs",
        databaseURL: "https://aresrpg-7daf4-default-rtdb.firebaseio.com",
        projectId: "aresrpg-7daf4",
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const auth = firebase.auth();
    
    let userPath = null; 
    let chartInstance = null;
    let ultimoID = null;
    let temHistorico = false;

    auth.onAuthStateChanged((user) => {
        if (user) {
            userPath = user.uid;
            document.getElementById('data-operacao').valueAsDate = new Date();
            
            // Carrega Nick e Preferência de Meta
            db.ref(`usuarios/${userPath}/perfil`).on('value', (snapshot) => {
                const perfil = snapshot.val();
                document.getElementById('user-display').innerText = `Jogador: ${perfil?.nick || user.email.split('@')[0]}`;
                
                if(perfil?.metaInvestimento) {
                    document.getElementById('porcentagem-meta').value = perfil.metaInvestimento;
                }
                atualizarCalculos();
            });

            carregarDados(); 
        } else {
            window.location.href = "index.html";
        }
    });

    // Salva a porcentagem no banco para não resetar
    function salvarPreferenciaMeta() {
        if(!userPath) return;
        const valor = document.getElementById('porcentagem-meta').value;
        db.ref(`usuarios/${userPath}/perfil`).update({
            metaInvestimento: valor
        });
    }

    function atualizarCalculos() {
        const capital = Number(document.getElementById('capital-input').value) || 0;
        const porcento = Number(document.getElementById('porcentagem-meta').value) || 0;
        const valor = capital * (porcento / 100);

        document.getElementById('contratos-qtd').innerText = Math.floor(capital / 1000);
        document.getElementById('meta-valor').innerText = `R$ ${valor.toFixed(2)}`;
        document.getElementById('loss-limite').innerText = `R$ ${valor.toFixed(2)}`;
        document.getElementById('label-meta').innerText = `Meta (${porcento}%)`;
        document.getElementById('label-loss').innerText = `Loss Diário (${porcento}%)`;
    }

    function salvarOperacao() {
        if (!userPath) return;
        const res = Number(document.getElementById('resultado-input').value);
        const dataInput = document.getElementById('data-operacao').value;

        if (document.getElementById('resultado-input').value === "") {
            return Swal.fire("Erro", "Preencha o valor!", "error");
        }

        let dataFormatada;
        let timestampBase;

        if (dataInput) {
            const partes = dataInput.split('-');
            dataFormatada = `${partes[2]}/${partes[1]}/${partes[0]}`;
            timestampBase = new Date(dataInput + "T12:00:00").getTime();
        } else {
            dataFormatada = new Date().toLocaleDateString('pt-BR');
            timestampBase = Date.now();
        }

        db.ref(`investimentos/${userPath}/historico`).push({
            data: dataFormatada,
            resultado: res,
            timestamp: timestampBase,
            tipo: temHistorico ? "operacao" : "inicial"
        }).then(() => {
            document.getElementById('resultado-input').value = "";
            Swal.fire("Sucesso!", "Dados atualizados!", "success");
        });
    }

    function apagarUltimo() {
        if (!ultimoID) return Swal.fire("Aviso", "Nada para apagar.", "info");
        Swal.fire({
            title: 'Remover registro?',
            text: "O saldo será recalculado automaticamente.",
            icon: 'warning',
            showCancelButton: true,
            confirmButtonText: 'Sim',
            cancelButtonText: 'Não'
        }).then((result) => {
            if (result.isConfirmed) {
                db.ref(`investimentos/${userPath}/historico/${ultimoID}`).remove();
            }
        });
    }

    function carregarDados() {
        db.ref(`investimentos/${userPath}/historico`).orderByChild('timestamp').on('value', snapshot => {
            const tbody = document.getElementById('tabela-corpo');
            tbody.innerHTML = "";
            
            let saldosProgresso = []; 
            let datasGrafico = [];
            let acumulado = 0;
            temHistorico = snapshot.exists();

            if(!temHistorico) {
                document.getElementById('label-resultado').innerText = "Capital Inicial (R$):";
                document.getElementById('aviso-inicial').style.display = "block";
            } else {
                document.getElementById('label-resultado').innerText = "Resultado Financeiro (R$):";
                document.getElementById('aviso-inicial').style.display = "none";
            }

            snapshot.forEach(doc => {
                const item = doc.val();
                ultimoID = doc.key;
                acumulado += item.resultado;
                
                saldosProgresso.push(acumulado);
                datasGrafico.push(item.data.slice(0, 5));

                const cor = item.resultado >= 0 ? "gain" : "loss";
                const sinal = item.resultado >= 0 ? "+" : "";
                
                tbody.insertAdjacentHTML('afterbegin', `
                    <tr>
                        <td>${item.data}</td>
                        <td class="${cor}">${item.tipo === 'inicial' ? '' : sinal} R$ ${item.resultado.toFixed(2)}</td>
                        <td>R$ ${acumulado.toFixed(2)}</td>
                    </tr>
                `);
            });

            document.getElementById('capital-input').value = acumulado.toFixed(2);
            atualizarCalculos();
            renderizarGrafico(saldosProgresso, datasGrafico);
        });
    }

    function renderizarGrafico(saldos, datas) {
        const ctx = document.getElementById('graficoEvolucao').getContext('2d');
        if (chartInstance) chartInstance.destroy();
        chartInstance = new Chart(ctx, {
            type: 'line',
            data: {
                labels: datas,
                datasets: [{
                    data: saldos,
                    borderColor: '#3b82f6',
                    backgroundColor: 'rgba(59, 130, 246, 0.1)',
                    fill: true,
                    tension: 0.3,
                    pointRadius: 4,
                    pointBackgroundColor: '#3b82f6'
                }]
            },
            options: { 
                responsive: true, 
                maintainAspectRatio: false, 
                plugins: { legend: { display: false } },
                scales: {
                    y: { grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#94a3b8' } },
                    x: { grid: { display: false }, ticks: { color: '#94a3b8' } }
                }
            }
        });
    }
</script>
</body>
</html>
