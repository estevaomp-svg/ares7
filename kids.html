    <style>
        :root { --primary: #fbbf24; --secondary: #60a5fa; --success: #4ade80; --bg: #1e3a8a; --danger: #ef4444; }
        body { font-family: Arial, sans-serif; background: var(--bg); color: white; padding: 15px; text-align: center; }
        .container { max-width: 500px; margin: auto; }
        h1 { color: var(--primary); font-size: 2.2rem; margin-bottom: 5px; }
        
        /* PAINEL PARA A MAMÃE */
        .painel-desempenho {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }
        .stat-card {
            background: rgba(255, 255, 255, 0.1);
            padding: 15px;
            border-radius: 20px;
            border: 2px solid var(--primary);
        }
        .stat-value { font-size: 1.5rem; font-weight: bold; display: block; }
        .stat-label { font-size: 0.8rem; text-transform: uppercase; opacity: 0.9; }

        .questao { 
            background: #ffffff; color: #1e293b; padding: 25px; border-radius: 25px; 
            margin-bottom: 25px; border: 6px solid var(--secondary);
            position: relative; transition: 0.3s;
        }

        .bloqueado { opacity: 0.6; filter: grayscale(1); pointer-events: none; }
        .msg-bloqueio { display: none; font-weight: bold; color: var(--danger); margin-top: 10px; font-size: 1.1rem; }
        .bloqueado .msg-bloqueio { display: block; }

        .pergunta { font-size: 1.5rem; font-weight: 900; margin-bottom: 20px; text-transform: uppercase; }
        .opcao { 
            display: block; width: 100%; padding: 18px; margin: 12px 0; 
            background: #f1f5f9; border: 3px solid var(--secondary); 
            border-radius: 15px; color: #1e3a8a; font-size: 1.3rem; 
            font-weight: bold; cursor: pointer;
        }
    </style>
</head>

    id: 79, 
    q: "O MESTRE GOJO É MUITO DIVERTIDO. QUAL É O CONTRÁRIO DE DIVERTIDO?", 
    opts: ["ALEGRE", "CHATO", "LEGAL"], 
    corr: 1, 
    exp: "ISSO AÍ! O CONTRÁRIO DE DIVERTIDO É CHATO!" 
},
{ 
    id: 80, 
    q: "VOCÊ TERMINOU AS MISSÕES! QUAL É O SENTIMENTO DE QUEM VENCE UM DESAFIO?", 
    opts: ["TRISTEZA", "FELICIDADE", "RAIVA"], 
    corr: 1, 
    exp: "COM CERTEZA! VOCÊ ESTÁ FELIZ PORQUE É UM CAMPEÃO, ÍCARO!" 
}
    ];

    function render() {
        const div = document.getElementById('quiz');
        const agora = Date.now();
        div.innerHTML = '';

        perguntasKids.forEach((p) => {
            const lastTime = localStorage.getItem(`kids_bloqueio_${p.id}`);
            const isBloqueado = lastTime && (agora - lastTime < COOLDOWN_MINUTES * 60000);
            
            div.innerHTML += `
                <div class="questao ${isBloqueado ? 'bloqueado' : ''}">
                    <div class="pergunta">${p.q}</div>
                    <div class="msg-bloqueio">⏳ ESPERE UM POUQUINHO PARA TENTAR DE NOVO!</div>
                    ${p.opts.map((o, idx) => `<button class="opcao" onclick="check(${p.id}, ${idx})">${o}</button>`).join('')}
                </div>
            `;
        });
        atualizarStats();
    }

    function check(pId, oIdx) {
        const p = perguntasKids.find(x => x.id === pId);
        localStorage.setItem(`kids_bloqueio_${pId}`, Date.now());
        
        totalHoje++;
        localStorage.setItem('kids_total_hoje', totalHoje);

        if(oIdx === p.corr) {
            estrelas++;
            acertosHoje++;
            localStorage.setItem('kids_estrelas', estrelas);
            localStorage.setItem('kids_acertos_hoje', acertosHoje);
            Swal.fire({ title: 'ISSO AÍ! 🌟', text: p.exp, icon: 'success' }).then(render);
        } else {
            Swal.fire({ title: 'QUASE! 🧐', text: 'ERROU, MAS PODE TENTAR DAQUI A POUCO!', icon: 'error' }).then(render);
        }
    }

    render();
    setInterval(render, 60000);
</script>
</body>
</html>
