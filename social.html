<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ares Social - Treinamento</title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        :root { --primary: #8b5cf6; --bg: #f3f4f6; --card: #ffffff; --text: #1f2937; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); color: var(--text); padding: 15px; line-height: 1.6; }
        .container { max-width: 600px; margin: auto; }
        h1 { color: var(--primary); text-align: center; }
        .questao { background: var(--card); padding: 25px; border-radius: 15px; margin-bottom: 20px; border-left: 8px solid var(--primary); box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .situacao { font-weight: bold; background: #ede9fe; padding: 10px; border-radius: 8px; margin-bottom: 15px; }
        .pergunta { font-size: 1.1rem; margin-bottom: 15px; }
        .opcao { 
            display: block; width: 100%; padding: 15px; margin: 10px 0; 
            background: #f9fafb; border: 2px solid #e5e7eb; border-radius: 10px; 
            color: var(--text); font-size: 1rem; cursor: pointer; text-align: left;
        }
        .opcao:hover { border-color: var(--primary); background: #f5f3ff; }
        .bloqueado { opacity: 0.5; pointer-events: none; filter: grayscale(1); }
    </style>
</head>
<body>

<div class="container">
    <h1>🧩 Ares Social</h1>
    <p style="text-align: center;">Treinamento de Padrões Sociais e Intenções</p>
    <div id="quiz"></div>
</div>

<script>
    const perguntasSocial = [
        { 
            id: 1, 
            situ: "Um conhecido diz: 'Nossa, você vai comer TUDO isso mesmo?'", 
            q: "Qual é a intenção mais provável por trás dessa frase?", 
            opts: ["Ele está genuinamente interessado na minha fome", "É uma crítica disfarçada de pergunta sobre o meu peso ou gula", "Ele quer dividir a comida comigo"], 
            corr: 1, 
            exp: "Tutorial: Geralmente, focar na quantidade de comida do outro é uma forma de julgamento social (maldade/zueira), não uma pergunta honesta." 
        },
        { 
            id: 2, 
            situ: "Você está contando algo e a pessoa olha o relógio e boceja.", 
            q: "O que esse sinal corporal indica?", 
            opts: ["A pessoa está com sono e quer café", "O relógio dela está estragado", "Ela está entediada e quer que você encerre o assunto"], 
            corr: 2, 
            exp: "Tutorial: Bocejos e olhar o relógio são sinais clássicos de que a pessoa perdeu o interesse. O padrão social é encerrar a fala em 1 ou 2 frases." 
        },
        { 
            id: 3, 
            situ: "Alguém ri e diz: 'Você é muito engraçadinha, né?' com um tom sério.", 
            q: "Isso é um elogio real?", 
            opts: ["Sim, ela me acha divertida", "Não, é sarcasmo. Ela achou o que eu disse inconveniente ou bobo", "Ela quer me contratar para um show"], 
            corr: 1, 
            exp: "Tutorial: Se o tom de voz não combina com o riso, quase sempre é sarcasmo. 'Engraçadinha' nesse contexto costuma ser uma crítica à sua fala." 
        },
        { 
            id: 4, 
            situ: "Um grupo de amigos está rindo de uma falha sua de forma repetida.", 
            q: "Como diferenciar brincadeira de 'zueira' maldosa?", 
            opts: ["Se eu pedir para parar e eles continuarem, virou maldade", "É sempre brincadeira se eles estiverem rindo", "É maldade apenas se usarem palavrões"], 
            corr: 0, 
            exp: "Tutorial: A regra social é: se o alvo da brincadeira não está rindo ou pediu para parar, o grupo deve parar. Se continuam, é falta de respeito (gaffe deles)." 
        },
        { 
            id: 5, 
            situ: "Alguém te convida dizendo: 'A gente precisa marcar um café qualquer dia!'", 
            q: "O que você deve fazer agora?", 
            opts: ["Pegar a agenda e perguntar o dia e a hora exatos", "Responder: 'Sim, vamos marcar!' e esperar ela sugerir uma data", "Dizer que não gosta de café"], 
            corr: 1, 
            exp: "Tutorial: Na maioria das vezes, isso é apenas uma 'frase de despedida cordial' e não um convite real. Se a pessoa não sugerir um dia, não se cobra." 
        },
{ 
            id: 6, 
            situ: "Você deu sua opinião, a pessoa não concordou e você já explicou 3 vezes de formas diferentes.", 
            q: "O que você deve fazer agora?", 
            opts: ["Explicar uma 4ª vez usando palavras mais difíceis", "Parar e dizer: 'Entendo seu ponto, vamos concordar em discordar'", "Ficar em silêncio e fechar a cara até ela entender"], 
            corr: 1, 
            exp: "Tutorial: Se após 3 explicações a pessoa não mudou de ideia, não é falha sua. É o direito dela de pensar diferente. Prolongar além disso gera estresse desnecessário e desgaste na sua imagem." 
        },
        { 
            id: 7, 
            situ: "Você precisa sair mais cedo para a terapia e percebe colegas trocando olhares ou cochichando.", 
            q: "Como reagir a esses olhares no trabalho?", 
            opts: ["Parar e explicar para todos o seu diagnóstico e o porquê da terapia", "Ignorar e seguir seu caminho, pois seu acordo é com a chefia", "Sair escondida para ninguém ver"], 
            corr: 1, 
            exp: "Tutorial: Você não deve explicações aos colegas. Se a empresa autorizou, o 'olhar' deles é um problema de falta de educação deles, não uma gaffe sua. Ignore." 
        },
        { 
            id: 8, 
            situ: "Em uma discussão de trabalho, o clima começa a esquentar e você sente seu coração acelerar.", 
            q: "Qual o comportamento correto para evitar uma crise de nervosismo?", 
            opts: ["Falar mais alto para ser ouvida", "Pedir uma pausa: 'Preciso de 5 minutos, vamos retomar isso depois'", "Continuar até que o outro admita que você está certa"], 
            corr: 1, 
            exp: "Tutorial: Reconhecer o sinal do corpo (coração acelerado) é o momento de pausar. No trabalho, pedir um tempo para 'esfriar a cabeça' é visto como maturidade, não fraqueza." 
        },
        { 
            id: 9, 
            situ: "Um chefe te faz uma crítica construtiva sobre uma tarefa que você fez.", 
            q: "Qual a melhor forma de reagir?", 
            opts: ["Dizer: 'Vou anotar os pontos para melhorar na próxima vez'", "Explicar detalhadamente por que você errou para ele não achar que você é burra", "Ficar triste e achar que será demitida"], 
            corr: 0, 
            exp: "Tutorial: No trabalho, críticas são sobre a TAREFA, não sobre VOCÊ. Aceitar o feedback com uma solução (anotar para melhorar) encerra o assunto de forma profissional." 
        },
        { 
            id: 10, 
            situ: "Alguém diz algo que você sabe que está errado, mas o assunto não é importante para o trabalho.", 
            q: "Vale a pena iniciar uma discussão para corrigir a pessoa?", 
            opts: ["Sim, a verdade é o mais importante sempre", "Não, se não afeta o resultado, deixe a pessoa com a opinião errada dela", "Corrigir e mandar o link da prova no WhatsApp dela"], 
            corr: 1, 
            exp: "Tutorial: Escolher quais 'batalhas' lutar poupa sua energia. Corrigir erros irrelevantes dos outros é visto socialmente como ser 'chato'. Deixe passar para manter a paz." 
        }
    ];

    function render() {
        const div = document.getElementById('quiz');
        div.innerHTML = '';
        perguntasSocial.forEach((p) => {
            const lastTime = localStorage.getItem(`social_bloqueio_${p.id}`);
            const isBloqueado = lastTime && (Date.now() - lastTime < 4 * 3600000); // 4 horas
            
            div.innerHTML += `
                <div class="questao ${isBloqueado ? 'bloqueado' : ''}">
                    <div class="situacao">SITUAÇÃO: ${p.situ}</div>
                    <div class="pergunta">${p.q}</div>
                    ${p.opts.map((o, idx) => `<button class="opcao" onclick="check(${p.id}, ${idx})">${o}</button>`).join('')}
                    ${isBloqueado ? '<p style="color:red">✔ Padrão memorizado. Disponível em 4h.</p>' : ''}
                </div>
            `;
        });
    }

    function check(pId, oIdx) {
        const p = perguntasSocial.find(x => x.id === pId);
        if(oIdx === p.corr) {
            localStorage.setItem(`social_bloqueio_${pId}`, Date.now());
            Swal.fire({ title: 'PADRÃO CORRETO!', text: p.exp, icon: 'success' }).then(render);
        } else {
            Swal.fire({ title: 'CUIDADO...', text: 'Nessa situação, a intenção costuma ser outra. Leia o tutorial no acerto!', icon: 'warning' });
        }
    }
    render();
</script>
</body>
</html>
