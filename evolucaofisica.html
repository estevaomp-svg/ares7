<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ares RPG - Evolução Física</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        :root { --primary: #3b82f6; --danger: #ef4444; --success: #22c55e; --bg: #0f172a; }
        body { font-family: 'Segoe UI', sans-serif; background: #0f172a; color: #f8fafc; padding: 15px; margin: 0; }
        .card { background: rgba(30, 41, 59, 0.9); padding: 20px; border-radius: 15px; border: 1px solid rgba(51, 65, 85, 0.5); margin-bottom: 15px; }
        .grid-fisico { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .stat-box { background: rgba(51, 65, 85, 0.6); padding: 10px; border-radius: 10px; text-align: center; border: 1px solid #475569; }
        input, select { width: 100%; padding: 8px; margin: 5px 0; border-radius: 5px; border: none; text-align: center; background: #1e293b; color: white; box-sizing: border-box; }
        button { cursor: pointer; padding: 10px; border: none; border-radius: 8px; color: white; font-weight: bold; width: 100%; background: var(--danger); transition: 0.3s; }
        button:hover { opacity: 0.8; }
        .btn-back { background: var(--primary); text-decoration: none; display: block; text-align: center; padding: 12px; border-radius: 8px; color: white; margin-bottom: 15px; font-weight: bold; }
    </style>
</head>
<body>
    <a href="./" class="btn-back">⬅ VOLTAR AO PAINEL</a>

    <div class="card">
        <h3 style="text-align:center; color: var(--danger);">🏋️ SALA DE TREINAMENTO</h3>
        <p id="p-status" style="text-align:center; color: #94a3b8; font-size: 14px;">Carregando...</p>
        <div class="grid-fisico" id="g-exercicios"></div>
    </div>

    <button onclick="window.location.href='./dieta.html'" 
    style="background: linear-gradient(45deg, #22c55e, #16a34a); color: white; border: none; padding: 15px; border-radius: 12px; font-weight: bold; font-size: 16px; width: 100%; margin-top: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.2); display: flex; align-items: center; justify-content: center; gap: 10px; cursor: pointer;">
    🥗 ABRIR DIETA & METAS
</button>

    <script>
        // --- SCRIPT PARA SUBSTITUIR ALERTA NATIVO PELO SWEETALERT2 ---
        window.alert = function(msg) {
            Swal.fire({
                title: 'Aviso',
                text: msg,
                icon: 'info',
                confirmButtonColor: '#3b82f6',
                background: '#1e293b',
                color: '#fff'
            });
        };

        const firebaseConfig = {
            apiKey: "AIzaSyBanevR51ejaTE0ccqlmlU6VRh7Qg4EETs",
            authDomain: "aresrpg-7daf4.firebaseapp.com",
            databaseURL: "https://aresrpg-7daf4-default-rtdb.firebaseio.com",
            projectId: "aresrpg-7daf4",
            storageBucket: "aresrpg-7daf4.firebasestorage.app",
            messagingSenderId: "153757603214",
            appId: "1:153757603214:web:fb572985353c8fad7f80df"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database(), auth = firebase.auth();
        let jogador = "";

        const exArr = [
            {id:'supino', n:'💪 Supino Reto/Máq', m:'kg', c:'#3b82f6', d:20}, {id:'biceps_rosca', n:'💪 Bíceps Rosca', m:'kg', c:'#3b82f6', d:15},
            {id:'triceps_pulley', n:'💪 Tríceps Pulley', m:'kg', c:'#3b82f6', d:15}, {id:'elevacao_pelvica', n:'🍑 Elevação Pélvica', m:'kg', c:'#f59e0b', d:20},
            {id:'puxada', n:'👐 Puxada Aberta', m:'kg', c:'#3b82f6', d:20}, {id:'remada', n:'🚣 Remada', m:'kg', c:'#3b82f6', d:20}, 
            {id:'elevacao_halters', n:'🦋 Elevação Halters', m:'kg', c:'#3b82f6', d:4}, {id:'leg_press', n:'🦵 Leg Press 45', m:'kg', c:'#f59e0b', d:30}, 
            {id:'hack', n:'🍑 Hack Machine', m:'kg', c:'#f59e0b', d:40}, {id:'extensora', n:'🦵 Extensora', m:'kg', c:'#f59e0b', d:20}, 
            {id:'panturrilha', n:'🦶 Panturrilha', m:'kg', c:'#f59e0b', d:40}, {id:'flexao', n:'🧘 Flexão Braço', m:'reps', c:'#10b981', d:10}, 
            {id:'barra', n:'🧗 Barra Fixa', m:'reps', c:'#10b981', d:10}, {id:'agachamentoLivre', n:'🤸 Agach. Livre', m:'reps', c:'#10b981', d:10}, 
            {id:'stamina', n:'跑 Cardio/Dança', m:'min', c:'#ec4899', d:10},
            {id:'natacao', n:'🏊 Nadar', m:'min', c:'#0ea5e9', d:10},
            {id:'corrida_km', n:'🏃 Corrida', m:'km', c:'#ec4899', d:1},
            {id:'stiff', n:'🍑 Stiff', m:'kg', c:'#f59e0b', d:20},
            {id:'levantamento_terra', n:'🏋️ Levantamento Terra', m:'kg', c:'#f59e0b', d:30},
            {id:'extensora_perna', n:'🦵 Cadeira Extensora', m:'kg', c:'#f59e0b', d:20}
        ];

        auth.onAuthStateChanged(u => {
            if(u) {
                jogador = u.email.split('@')[0].replace(/[.#$[\]]/g, "_");
                db.ref('rpg_data/' + jogador).on('value', s => { 
                    const d = s.val() || {};
                    document.getElementById('p-status').innerText = "Atleta: " + (d.nick || jogador);
                    render(d); 
                });
            } else { document.getElementById('p-status').innerText = "Faça login no site principal."; }
        });

        function render(p) {
            const g = document.getElementById('g-exercicios');
            g.innerHTML = exArr.map(ex => {
                const r = (p.records && p.records[ex.id]) !== undefined ? p.records[ex.id] : ex.d;
                return `<div class="stat-box" style="border-top: 3px solid ${ex.c};">
                    <b style="color:${ex.c}; font-size:11px;">${ex.n}</b><br><span style="font-size:10px;">Rec: ${r}${ex.m}</span>
                    <input type="number" id="in-${ex.id}" placeholder="+"><button style="background:${ex.c};" onclick="up('${ex.id}','${ex.m}',${r})">UP</button>
                </div>`;
            }).join('');
        }

        async function up(id, m, r) {
            const v = parseInt(document.getElementById('in-' + id).value);
            if (!v || v === r) return alert("Digite um valor diferente do atual!");
            
            const snap = await db.ref('rpg_data/' + jogador).get();
            const p = snap.val();
            const agora = Date.now();
            const hist = p.evolucao_diaria || {};
            const dEx = hist[id] || { totalSubido: 0, ultimaData: 0 };
            const horas = (agora - dEx.ultimaData) / (1000 * 60 * 60);
            let jaSubiu = (horas < 20) ? dEx.totalSubido : 0;
            const diferenca = v - r; 

            if (diferenca > 0) {
                if ((jaSubiu + diferenca) > 10) { 
                    return alert(`Limite diário de +10 excedido! Você já subiu ${jaSubiu} hoje.`); 
                }
            }

            let mult = (id === 'elevacao_halters') ? 500 : 100;
            let variacaoXP = (m === 'kg') ? diferenca * mult : diferenca * 45;
            const novosRecs = { ... (p.records || {}) }; 
            novosRecs[id] = v;
            const novoHist = { ...hist };
            if (diferenca > 0) { novoHist[id] = { totalSubido: jaSubiu + diferenca, ultimaData: agora }; }

            // Lógica de confirmação customizada com SweetAlert2 para substituição do confirm() nativo
            if (diferenca < 0) {
                const result = await Swal.fire({
                    title: 'Tem certeza?',
                    text: `Você está reduzindo seu recorde. Isso custará ${Math.abs(variacaoXP)} de XP. Confirmar correção?`,
                    icon: 'warning',
                    showCancelButton: true,
                    confirmButtonColor: '#ef4444',
                    cancelButtonColor: '#3b82f6',
                    confirmButtonText: 'Sim, corrigir!',
                    cancelButtonText: 'Cancelar',
                    background: '#1e293b',
                    color: '#fff'
                });
                if (!result.isConfirmed) return;
            }

            await db.ref('rpg_data/' + jogador).update({
                xp: Math.max(0, (p.xp || 0) + variacaoXP), 
                coins: Math.max(0, (p.coins || 0) + (variacaoXP > 0 ? variacaoXP : 0)),
                records: novosRecs, 
                evolucao_diaria: novoHist
            });

            Swal.fire({
                title: diferenca > 0 ? 'Bom trabalho!' : 'Corrigido',
                text: diferenca > 0 ? `UP! +${variacaoXP} XP` : `Ajuste realizado com sucesso.`,
                icon: 'success',
                confirmButtonColor: '#22c55e',
                background: '#1e293b',
                color: '#fff'
            });
        }

        function calcularBio() {
            const peso = parseFloat(document.getElementById('calc-peso').value);
            const altura = parseFloat(document.getElementById('calc-altura').value);
            const idade = parseFloat(document.getElementById('calc-idade').value);
            const sexo = document.getElementById('calc-sexo').value;
            const pescoco = parseFloat(document.getElementById('calc-pescoco').value);
            const cintura = parseFloat(document.getElementById('calc-cintura').value);
            const quadril = parseFloat(document.getElementById('calc-quadril').value);

            if (!peso || !altura || !idade) return alert("Preencha Peso, Altura e Idade!");

            let tmb = (sexo === 'm') ? (10 * peso) + (6.25 * altura) - (5 * idade) + 5 : (10 * peso) + (6.25 * altura) - (5 * idade) - 161;
            let manutencao = Math.round(tmb * 1.375);

            let alturaPol = altura / 2.54;
            let pesoIdeal = (sexo === 'm') ? 52 + 1.9 * (alturaPol - 60) : 49 + 1.7 * (alturaPol - 60);

            let bf = "--";
            if (pescoco && cintura) {
                if (sexo === 'm') {
                    bf = (495 / (1.0324 - 0.19077 * Math.log10(cintura - pescoco) + 0.15456 * Math.log10(altura))) - 450;
                } else {
                    if (!quadril) {
                        return alert("Para mulheres, a medida do quadril é necessária!");
                    }
                    bf = (495 / (1.29579 - 0.35004 * Math.log10(cintura + quadril - pescoco) + 0.221 * Math.log10(altura))) - 450;
                }
                bf = Math.max(0, bf).toFixed(1) + "%";
            }

            document.getElementById('res-manter').innerText = manutencao + " kcal";
            document.getElementById('res-peso-ideal').innerText = Math.round(pesoIdeal) + " kg";
            document.getElementById('res-bf').innerText = bf;
            document.getElementById('resultado-bio').style.display = 'block';
        }
    </script>
</body>
</html>
