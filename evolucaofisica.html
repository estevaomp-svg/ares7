<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Life RPG - Evolução Física</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        :root { --primary: #3b82f6; --danger: #ef4444; --success: #22c55e; --bg: #0f172a; --card: #1e293b; }
        body { font-family: 'Segoe UI', sans-serif; background: #0f172a; color: #f8fafc; padding: 15px; margin: 0; }
        .card { background: rgba(30, 41, 59, 0.9); padding: 20px; border-radius: 15px; border: 1px solid rgba(51, 65, 85, 0.5); margin-bottom: 15px; }
        .grid-fisico { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .stat-box { background: rgba(51, 65, 85, 0.6); padding: 10px; border-radius: 10px; text-align: center; border: 1px solid #475569; }
        input, select { width: 100%; padding: 8px; margin: 5px 0; border-radius: 5px; border: none; text-align: center; background: #1e293b; color: white; box-sizing: border-box; }
        button { cursor: pointer; padding: 10px; border: none; border-radius: 8px; color: white; font-weight: bold; width: 100%; background: var(--danger); transition: 0.3s; }
        button:hover { opacity: 0.8; }
        .btn-back { background: var(--primary); text-decoration: none; display: block; text-align: center; padding: 12px; border-radius: 8px; color: white; margin-bottom: 15px; font-weight: bold; }
        
        /* Estilos do painel de status e ficha */
        .status-panel { display: flex; justify-content: space-around; background: #0f172a; border-radius: 12px; padding: 15px; border: 1px solid #475569; }
        .status-item { text-align: center; width: 45%; }
        .status-item small { color: #94a3b8; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px; }
        .status-item strong { display: block; font-size: 2rem; margin: 5px 0; text-shadow: 0 0 10px rgba(0,0,0,0.5); }
        .status-item span { font-size: 0.75rem; color: #64748b; }
        .forca-text { color: #ef4444; }
        .stamina-text { color: #3b82f6; }

        /* Estilo da grade da Ficha de Treino */
        .grid-ficha { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 10px; }
        .ficha-item { background: #0f172a; border-radius: 12px; padding: 15px; text-align: center; border: 1px solid #475569; }
        
        /* Checkbox customizado do popup */
        .swal-check-list { text-align: left; max-height: 250px; overflow-y: auto; padding: 10px; background: #0f172a; border-radius: 8px; border: 1px solid #334155; }
        .swal-check-label { display: flex; align-items: center; margin-bottom: 10px; cursor: pointer; font-size: 14px; }
        .swal-check-label input { width: auto; margin: 0 10px 0 0; transform: scale(1.2); cursor: pointer; }
    </style>
</head>
<body>
    <a href="./" class="btn-back">⬅ VOLTAR</a>

    <button onclick="window.location.href='./dieta.html'" 
        style="background: linear-gradient(45deg, #22c55e, #16a34a); color: white; border: none; padding: 15px; border-radius: 12px; font-weight: bold; font-size: 16px; width: 100%; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.2); display: flex; align-items: center; justify-content: center; gap: 10px; cursor: pointer;">
        🥗 Abrir Dieta/Avaliação Corporal
    </button>

    <div class="card">
        <h3 style="text-align:center; color: #fbbf24; margin-top: 0;">⚡ STATUS DO ATLETA</h3>
        <p id="p-status" style="text-align:center; color: #94a3b8; font-size: 14px; margin-top: -10px; margin-bottom: 15px;">Carregando...</p>
        
        <div class="status-panel">
            <div class="status-item" style="border-bottom: 3px solid #ef4444;">
                <small>Força Física</small>
                <strong id="lvl-forca" class="forca-text">Lvl 0</strong>
                <span id="nome-forca">N/A</span>
            </div>
            <div class="status-item" style="border-bottom: 3px solid #3b82f6;">
                <small>Stamina</small>
                <strong id="lvl-stamina" class="stamina-text">Lvl 0</strong>
                <span id="nome-stamina">N/A</span>
            </div>
        </div>
    </div>

    <div class="card">
        <h3 style="text-align:center; color: #10b981; margin-top: 0;">📋 MINHA FICHA DE TREINO</h3>
        
        <div class="grid-ficha" id="g-ficha">
            </div>

        <button onclick="abrirEditorFicha()" style="background: #475569; margin-top: 15px; padding: 12px; font-size: 14px; width: 100%; border-radius: 8px;">
            ⚙️ Editar Ficha
        </button>
    </div>

    <div class="card">
        <h3 style="text-align:center; color: var(--danger);">🏋️ SALA DE TREINAMENTO</h3>
        <div class="grid-fisico" id="g-exercicios"></div>
    </div>

    <script>
        window.alert = function(msg) {
            Swal.fire({ title: 'Aviso', text: msg, icon: 'info', confirmButtonColor: '#3b82f6', background: '#1e293b', color: '#fff' });
        };

        const firebaseConfig = {
            apiKey: "AIzaSyBanevR51ejaTE0ccqlmlU6VRh7Qg4EETs",
            authDomain: "aresrpg-7daf4.firebaseapp.com",
            databaseURL: "https://aresrpg-7daf4-default-rtdb.firebaseio.com",
            projectId: "aresrpg-7daf4",
            storageBucket: "aresrpg-7daf4.firebasestorage.app",
            messagingSenderId: "153757603214",
            appId: "1:153757603214:web:fb572985353c8fad7f80df"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database(), auth = firebase.auth();
        let jogador = "";
        let dadosAtleta = {}; // Variável global para guardar os dados e facilitar as funções

        const exArr = [
            {id:'supino', n:'💪 Supino Reto/Máq', m:'kg', c:'#3b82f6', d:20}, {id:'biceps_rosca', n:'💪 Bíceps Rosca', m:'kg', c:'#3b82f6', d:15},
            {id:'triceps_pulley', n:'💪 Tríceps Pulley', m:'kg', c:'#3b82f6', d:15}, {id:'elevacao_pelvica', n:'🍑 Elevação Pélvica', m:'kg', c:'#f59e0b', d:20},
            {id:'puxada', n:'👐 Puxada Aberta', m:'kg', c:'#3b82f6', d:20}, {id:'remada', n:'🚣 Remada', m:'kg', c:'#3b82f6', d:20}, 
            {id:'elevacao_halters', n:'🦋 Elevação Halters', m:'kg', c:'#3b82f6', d:4}, {id:'leg_press', n:'🦵 Leg Press 45', m:'kg', c:'#f59e0b', d:30}, 
            {id:'hack', n:'🍑 Hack Machine', m:'kg', c:'#f59e0b', d:40}, {id:'extensora', n:'🦵 Extensora', m:'kg', c:'#f59e0b', d:20}, 
            {id:'panturrilha', n:'🦶 Panturrilha', m:'kg', c:'#f59e0b', d:40}, {id:'flexao', n:'🧘 Flexão Braço', m:'reps', c:'#10b981', d:10}, 
            {id:'barra', n:'🧗 Barra Fixa', m:'reps', c:'#10b981', d:10}, {id:'agachamentoLivre', n:'🤸 Agach. Livre', m:'reps', c:'#10b981', d:10}, 
            {id:'stamina', n:'跑 Cardio/Dança', m:'min', c:'#ec4899', d:10},
            {id:'natacao', n:'🏊 Nadar', m:'min', c:'#0ea5e9', d:10},
            {id:'corrida_km', n:'🏃 Corrida', m:'km', c:'#ec4899', d:1},
            {id:'stiff', n:'🍑 Stiff', m:'kg', c:'#f59e0b', d:20},
            {id:'levantamento_terra', n:'🏋️ Levantamento Terra', m:'kg', c:'#f59e0b', d:30},
            {id:'extensora_perna', n:'🦵 Cadeira Extensora', m:'kg', c:'#f59e0b', d:20}
        ];

        auth.onAuthStateChanged(u => {
            if(u) {
                jogador = u.email.split('@')[0].replace(/[.#$[\]]/g, "_");
                db.ref('rpg_data/' + jogador).on('value', s => { 
                    dadosAtleta = s.val() || {};
                    document.getElementById('p-status').innerText = "Atleta: " + (dadosAtleta.nick || jogador);
                    atualizarStatus(dadosAtleta);
                    renderFicha(dadosAtleta);
                    renderTreinamento(dadosAtleta); 
                });
            } else { document.getElementById('p-status').innerText = "Faça login no site principal."; }
        });

        // 1. Calcula o Nível Baseado no Maior Recorde
        function atualizarStatus(p) {
            let maxForca = 0, melhorForca = "Nenhum";
            let maxStamina = 0, melhorStamina = "Nenhum";

            exArr.forEach(ex => {
                const recordeAtual = (p.records && p.records[ex.id]) !== undefined ? p.records[ex.id] : ex.d;
                if (ex.m === 'kg') {
                    if (recordeAtual > maxForca) {
                        maxForca = recordeAtual;
                        melhorForca = ex.n.replace(/[\uD800-\uDBFF][\uDC00-\uDFFF]\s?/, ''); 
                    }
                } else if (ex.m === 'reps' || ex.m === 'min' || ex.m === 'km') {
                    if (recordeAtual > maxStamina) {
                        maxStamina = recordeAtual;
                        melhorStamina = ex.n.replace(/[\uD800-\uDBFF][\uDC00-\uDFFF]\s?/, '');
                    }
                }
            });

            document.getElementById('lvl-forca').innerText = 'Lvl ' + maxForca;
            document.getElementById('nome-forca').innerText = melhorForca + ' (' + maxForca + 'kg)';
            document.getElementById('lvl-stamina').innerText = 'Lvl ' + maxStamina;
            document.getElementById('nome-stamina').innerText = melhorStamina + ' (' + maxStamina + ')';
        }

        // 2. Renderiza a Ficha de Treino
        function renderFicha(p) {
            const fichaDiv = document.getElementById('g-ficha');
            const minhaFicha = p.ficha_treino || []; // Array de IDs salvos no banco

            if (minhaFicha.length === 0) {
                fichaDiv.innerHTML = '<p style="text-align: center; color: #64748b; width: 100%; grid-column: 1 / -1;">Sua ficha está vazia.<br>Clique em <b>Editar Ficha</b> para montar seu treino.</p>';
                return;
            }

            fichaDiv.innerHTML = minhaFicha.map(id => {
                const ex = exArr.find(e => e.id === id);
                if (!ex) return ''; // Prevenção contra bugs
                
                const recordeAtual = (p.records && p.records[ex.id]) !== undefined ? p.records[ex.id] : ex.d;
                
                // Exatamente o mesmo design visual do Status
                return `
                <div class="ficha-item status-item" style="border-bottom: 3px solid ${ex.c}; width: 100%;">
                    <small style="font-size: 0.65rem;">${ex.n}</small>
                    <strong style="font-size: 1.5rem; color: #f8fafc;">${recordeAtual}</strong>
                    <span>${ex.m}</span>
                </div>`;
            }).join('');
        }

        // 3. Pop-up para Montar a Ficha
        async function abrirEditorFicha() {
            const fichaAtual = dadosAtleta.ficha_treino || [];

            // Monta a lista de opções com checkboxes
            let htmlOptions = '<div class="swal-check-list">';
            exArr.forEach(ex => {
                const checked = fichaAtual.includes(ex.id) ? 'checked' : '';
                htmlOptions += `
                    <label class="swal-check-label">
                        <input type="checkbox" value="${ex.id}" class="ficha-checkbox" ${checked}>
                        <span style="color: ${ex.c};">${ex.n}</span>
                    </label>
                `;
            });
            htmlOptions += '</div>';

            const { value: novosSelecionados } = await Swal.fire({
                title: 'Montar Ficha',
                html: htmlOptions,
                focusConfirm: false,
                showCancelButton: true,
                confirmButtonText: 'Salvar Ficha',
                cancelButtonText: 'Cancelar',
                background: '#1e293b',
                color: '#fff',
                preConfirm: () => {
                    const checkboxes = document.querySelectorAll('.ficha-checkbox:checked');
                    let selecionados = [];
                    checkboxes.forEach(cb => selecionados.push(cb.value));
                    return selecionados;
                }
            });

            if (novosSelecionados) {
                // Salva no banco de dados com a teoria da permissão
                await db.ref('rpg_data/' + jogador).update({ ficha_treino: novosSelecionados });
                Swal.fire({ title: 'Equipado!', text: 'Sua ficha foi atualizada.', icon: 'success', background: '#1e293b', color: '#fff', timer: 1500, showConfirmButton: false });
            }
        }

        // 4. Renderiza todos os exercícios na Sala de Treinamento
        function renderTreinamento(p) {
            const g = document.getElementById('g-exercicios');
            g.innerHTML = exArr.map(ex => {
                const r = (p.records && p.records[ex.id]) !== undefined ? p.records[ex.id] : ex.d;
                return `<div class="stat-box" style="border-top: 3px solid ${ex.c};">
                    <b style="color:${ex.c}; font-size:11px;">${ex.n}</b><br><span style="font-size:10px;">Rec: ${r}${ex.m}</span>
                    <input type="number" id="in-${ex.id}" placeholder="+"><button style="background:${ex.c};" onclick="up('${ex.id}','${ex.m}',${r})">UP</button>
                </div>`;
            }).join('');
        }

        // Sistema de Upar e Ganhar XP (Seu código original mantido)
        async function up(id, m, r) {
            const v = parseInt(document.getElementById('in-' + id).value);
            if (!v || v === r) return alert("Digite um valor diferente do atual!");
            
            const snap = await db.ref('rpg_data/' + jogador).get();
            const p = snap.val();
            const agora = Date.now();
            const hist = p.evolucao_diaria || {};
            const dEx = hist[id] || { totalSubido: 0, ultimaData: 0 };
            const horas = (agora - dEx.ultimaData) / (1000 * 60 * 60);
            let jaSubiu = (horas < 20) ? dEx.totalSubido : 0;
            const diferenca = v - r; 

            if (diferenca > 0) {
                if ((jaSubiu + diferenca) > 10) { 
                    return alert(`Limite diário de +10 excedido! Você já subiu ${jaSubiu} hoje.`); 
                }
            }

            let mult = (id === 'elevacao_halters') ? 500 : 100;
            let variacaoXP = (m === 'kg') ? diferenca * mult : diferenca * 45;
            const novosRecs = { ... (p.records || {}) }; 
            novosRecs[id] = v;
            const novoHist = { ...hist };
            if (diferenca > 0) { novoHist[id] = { totalSubido: jaSubiu + diferenca, ultimaData: agora }; }

            if (diferenca < 0) {
                const result = await Swal.fire({
                    title: 'Tem certeza?',
                    text: `Você está reduzindo seu recorde. Isso custará ${Math.abs(variacaoXP)} de XP. Confirmar correção?`,
                    icon: 'warning',
                    showCancelButton: true,
                    confirmButtonColor: '#ef4444',
                    cancelButtonColor: '#3b82f6',
                    confirmButtonText: 'Sim, corrigir!',
                    cancelButtonText: 'Cancelar',
                    background: '#1e293b',
                    color: '#fff'
                });
                if (!result.isConfirmed) return;
            }

            await db.ref('rpg_data/' + jogador).update({
                xp: Math.max(0, (p.xp || 0) + variacaoXP), 
                coins: Math.max(0, (p.coins || 0) + (variacaoXP > 0 ? variacaoXP : 0)),
                records: novosRecs, 
                evolucao_diaria: novoHist
            });

            Swal.fire({
                title: diferenca > 0 ? 'Bom trabalho!' : 'Corrigido',
                text: diferenca > 0 ? `UP! +${variacaoXP} XP` : `Ajuste realizado com sucesso.`,
                icon: 'success',
                confirmButtonColor: '#22c55e',
                background: '#1e293b',
                color: '#fff'
            });
        }
    </script>
</body>
</html>
