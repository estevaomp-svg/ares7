<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real Life RPG - Concurso MGS</title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        :root { --primary: #3b82f6; --success: #22c55e; --danger: #ef4444; --bg: #0f172a; --card: #1e293b; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: #f8fafc; padding: 15px; margin: 0; }
        .container { max-width: 600px; margin: auto; }
        .stats-bar { background: var(--card); padding: 15px; border-radius: 12px; display: flex; justify-content: space-around; margin-bottom: 20px; border: 1px solid var(--primary); }
        .stat-item { text-align: center; }
        .stat-value { display: block; font-size: 1.2rem; font-weight: bold; color: var(--primary); }
        .questao { background: var(--card); padding: 20px; border-radius: 15px; border: 1px solid rgba(51, 65, 85, 0.5); margin-bottom: 20px; position: relative; }
        .bloqueada { opacity: 0.5; pointer-events: none; filter: grayscale(1); }
        .badge { background: var(--primary); padding: 4px 10px; border-radius: 6px; font-size: 0.75rem; font-weight: bold; margin-bottom: 10px; display: inline-block; }
        .opcao { display: block; width: 100%; padding: 14px; margin: 10px 0; background: rgba(15, 23, 42, 0.6); border: 1px solid #334155; border-radius: 10px; color: #cbd5e1; cursor: pointer; text-align: left; transition: 0.2s; }
        .opcao:hover { background: var(--primary); color: white; }
        .timer-msg { font-size: 0.8rem; color: #94a3b8; margin-top: 10px; display: none; }
        .bloqueada .timer-msg { display: block; }
    </style>
</head>
<body>

<div class="container">
    <div class="stats-bar">
        <div class="stat-item"><span class="stat-value" id="total-hoje">0</span>Acertos Hoje</div>
        <div class="stat-item"><span class="stat-value" id="percentual">0%</span>Precisão</div>
    </div>
    <div id="quiz"></div>
</div>

<script>
    const questoes = [
        // --- MATEMÁTICA ---
        { id: 1, cat: "MATEMÁTICA", q: "Um conjunto possui 5 elementos. Quantos subconjuntos ele tem ao todo?", opts: ["10", "25", "32"], corr: 2, exp: "Fórmula 2^n. 2x2x2x2x2 = 32." },
        { id: 2, cat: "MATEMÁTICA", q: "Se 15% de um valor é R$ 45,00, qual o valor total?", opts: ["R$ 300,00", "R$ 450,00", "R$ 150,00"], corr: 0, exp: "Se 15% é 45, 100% será 300." },
        { id: 3, cat: "MATEMÁTICA", q: "Um produto custa R$ 200,00 e sofre um desconto de 15%. Qual o valor final?", opts: ["R$ 170,00", "R$ 185,00", "R$ 175,00"], corr: 0, exp: "15% de 200 é 30. 200-30=170." },
        { id: 4, cat: "MATEMÁTICA", q: "Se 3 funcionários limpam 6 salas, quantos funcionários limpam 10 salas?", opts: ["4", "5", "6"], corr: 1, exp: "Regra de 3: 3/6 = x/10 -> x=5." },
        { id: 5, cat: "MATEMÁTICA", q: "Qual o valor de X na equação: 2x + 10 = 40?", opts: ["10", "15", "20"], corr: 1, exp: "2x = 30, logo x = 15." },
        { id: 6, cat: "MATEMÁTICA", q: "Quanto é 2/5 de R$ 1.000,00?", opts: ["R$ 200", "R$ 400", "R$ 500"], corr: 1, exp: "1000/5=200. 200x2=400." },
        { id: 7, cat: "MATEMÁTICA", q: "A raiz quadrada de 144 menos a raiz quadrada de 49 é:", opts: ["5", "7", "12"], corr: 0, exp: "12 - 7 = 5." },
        { id: 8, cat: "MATEMÁTICA", q: "Um relógio atrasa 2 min por hora. Em 24 horas atrasará:", opts: ["24 min", "48 min", "60 min"], corr: 1, exp: "24 x 2 = 48." },
        { id: 9, cat: "MATEMÁTICA", q: "Quantos segundos existem em 2 horas?", opts: ["3600", "7200", "120"], corr: 1, exp: "2 x 60 x 60 = 7200." },
        { id: 10, cat: "MATEMÁTICA", q: "Se x + 7 = 15, qual o valor de 2x?", opts: ["8", "16", "14"], corr: 1, exp: "x=8, logo 2x=16." },
        { id: 11, cat: "MATEMÁTICA", q: "Perímetro de um quadrado de lado 8m:", opts: ["16m", "32m", "64m"], corr: 1, exp: "8+8+8+8 = 32." },
        { id: 12, cat: "MATEMÁTICA", q: "Quanto é 0,5 x 0,5?", opts: ["1,0", "0,25", "0,5"], corr: 1, exp: "Meio x Meio = 0,25." },
        { id: 13, cat: "MATEMÁTICA", q: "Soma de 1/2 com 1/4:", opts: ["2/6", "3/4", "1/6"], corr: 1, exp: "0,5 + 0,25 = 0,75 (3/4)." },
        { id: 14, cat: "MATEMÁTICA", q: "10% de 10% de 100:", opts: ["1", "10", "0,1"], corr: 0, exp: "10% de 100 é 10. 10% de 10 é 1." },

        // --- NOÇÕES DE INFORMÁTICA ---
        { id: 15, cat: "INFORMÁTICA", q: "Atalho 'Windows + D' serve para:", opts: ["Documentos", "Mostrar Área de Trabalho", "Desligar"], corr: 1, exp: "D de Desktop." },
        { id: 16, cat: "INFORMÁTICA", q: "No Excel, toda fórmula começa com:", opts: ["+", "#", "="], corr: 2, exp: "O sinal '=' é obrigatório." },
        { id: 17, cat: "INFORMÁTICA", q: "Qual memória apaga ao desligar?", opts: ["HD", "SSD", "RAM"], corr: 2, exp: "RAM é volátil." },
        { id: 18, cat: "INFORMÁTICA", q: "Atalho para fechar aba no navegador:", opts: ["Ctrl + W", "Alt + F4", "Ctrl + T"], corr: 0, exp: "Ctrl+W fecha a aba atual." },
        { id: 19, cat: "INFORMÁTICA", q: "O protocolo HTTPS indica:", opts: ["Vírus", "Segurança/Criptografia", "Lentidão"], corr: 1, exp: "S de Secure." },
        { id: 20, cat: "INFORMÁTICA", q: "Atalho Ctrl + K no Word:", opts: ["Hiperlink", "Negrito", "Itálico"], corr: 0, exp: "Insere links." },
        { id: 21, cat: "INFORMÁTICA", q: "Extensão de imagem:", opts: [".docx", ".jpg", ".exe"], corr: 1, exp: "JPG é imagem." },
        { id: 22, cat: "INFORMÁTICA", q: "Função do Firewall:", opts: ["Aumentar sinal", "Proteger a rede", "Limpar disco"], corr: 1, exp: "Barreira de segurança." },
        { id: 23, cat: "INFORMÁTICA", q: "Atalho Gerenciador de Tarefas:", opts: ["Ctrl+Alt+Del", "Ctrl+Shift+Esc", "Alt+Tab"], corr: 1, exp: "Abre direto o gerenciador." },
        { id: 24, cat: "INFORMÁTICA", q: "O que é Hardware?", opts: ["Peças físicas", "Programas", "Internet"], corr: 0, exp: "Tudo o que é físico." },
        { id: 25, cat: "INFORMÁTICA", q: "Atalho Bloquear Tela:", opts: ["Win + L", "Win + B", "Win + X"], corr: 0, exp: "L de Lock." },
        { id: 26, cat: "INFORMÁTICA", q: "No Excel, a função =MÉDIA(A1:A3) faz:", opts: ["Soma", "Média aritmética", "Maior valor"], corr: 1, exp: "Calcula a média do intervalo." },
        { id: 27, cat: "INFORMÁTICA", q: "Qual atalho 'Recorta' um item?", opts: ["Ctrl+C", "Ctrl+X", "Ctrl+V"], corr: 1, exp: "X parece uma tesoura." },

        // --- PORTUGUÊS ---
        { id: 28, cat: "PORTUGUÊS", q: "Escrita correta:", opts: ["Exceção", "Excessão", "Esceção"], corr: 0, exp: "XC e Ç." },
        { id: 29, cat: "PORTUGUÊS", q: "Uso do 'onde':", opts: ["Tempo", "Lugar", "Pessoas"], corr: 1, exp: "Apenas para lugar físico." },
        { id: 30, cat: "PORTUGUÊS", q: "Plural de Pão-de-ló:", opts: ["Pães-de-ló", "Pão-de-lós", "Pães-de-lós"], corr: 0, exp: "Só o primeiro elemento muda." },
        { id: 31, cat: "PORTUGUÊS", q: "Sinônimo de Inócuo:", opts: ["Inofensivo", "Perigoso", "Útil"], corr: 0, exp: "Não faz mal." },
        { id: 32, cat: "PORTUGUÊS", q: "Proibido crase antes de:", opts: ["Horas", "Verbos", "Cidades"], corr: 1, exp: "Nunca antes de verbo." },
        { id: 33, cat: "PORTUGUÊS", q: "Frase correta:", opts: ["Faziam meses", "Faz meses", "Houveram erros"], corr: 1, exp: "Tempo decorrido = singular." },
        { id: 34, cat: "PORTUGUÊS", q: "Coletivo de Mapas:", opts: ["Almanaque", "Atlas", "Pinacoteca"], corr: 1, exp: "Atlas." },
        { id: 35, cat: "PORTUGUÊS", q: "Palavra Proparoxítona:", opts: ["Pajé", "Automóvel", "Lâmpada"], corr: 2, exp: "Acentuada na antepenúltima." },
        { id: 36, cat: "PORTUGUÊS", q: "Antônimo de Mal (com L):", opts: ["Bom", "Bem", "Ótimo"], corr: 1, exp: "Mal/Bem. Mau/Bom." },
        { id: 37, cat: "PORTUGUÊS", q: "Plural de Cidadão:", opts: ["Cidadões", "Cidadãos", "Cidadães"], corr: 1, exp: "Cidadãos." },
        { id: 38, cat: "PORTUGUÊS", q: "Significado de Retificar:", opts: ["Confirmar", "Corrigir", "Repetir"], corr: 1, exp: "Retificar = Corrigir." },
        { id: 39, cat: "PORTUGUÊS", q: "Assinale a correta:", opts: ["Menos pessoas", "Menas pessoas", "Pessoas menas"], corr: 0, exp: "Menas não existe." },
        { id: 40, cat: "PORTUGUÊS", q: "A gente ___ viajar.", opts: ["vamos", "vai", "iremos"], corr: 1, exp: "A gente vai (singular)." }
    ];

    function renderizar() {
        const container = document.getElementById('quiz');
        container.innerHTML = '';
        const agora = Date.now();

        questoes.forEach(q => {
            const bloqueio = localStorage.getItem(`bloqueio_${q.id}`);
            const isBloqueada = bloqueio && (agora - bloqueio < 4 * 60 * 60 * 1000);

            container.innerHTML += `
                <div class="questao ${isBloqueada ? 'bloqueada' : ''}">
                    <span class="badge">${q.cat}</span>
                    <div>${q.q}</div>
                    <div class="timer-msg">⏳ Bloqueada por 4h após resposta.</div>
                    ${q.opts.map((opt, i) => `<button class="opcao" onclick="verificar(${q.id}, ${i})">${opt}</button>`).join('')}
                </div>
            `;
        });
        atualizarStats();
    }

    function verificar(qId, optIdx) {
        const q = questoes.find(x => x.id === qId);
        let acertos = parseInt(localStorage.getItem('acertos_dia') || 0);
        let total = parseInt(localStorage.getItem('total_tentativas') || 0);

        localStorage.setItem(`bloqueio_${qId}`, Date.now());
        localStorage.setItem('total_tentativas', total + 1);

        if (optIdx === q.corr) {
            localStorage.setItem('acertos_dia', acertos + 1);
            Swal.fire({ title: 'Boa!', text: q.exp, icon: 'success' }).then(renderizar);
        } else {
            Swal.fire({ title: 'Errou!', text: 'Resposta certa: ' + q.opts[q.corr], icon: 'error' }).then(renderizar);
        }
    }

    function atualizarStats() {
        const acertos = parseInt(localStorage.getItem('acertos_dia') || 0);
        const total = parseInt(localStorage.getItem('total_tentativas') || 0);
        const perc = total > 0 ? Math.round((acertos / total) * 100) : 0;
        document.getElementById('total-hoje').innerText = acertos;
        document.getElementById('percentual').innerText = perc + '%';
    }

    renderizar();
</script>
</body>
</html>
