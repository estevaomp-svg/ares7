<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ares RPG - Dieta & Bioestatística</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        :root { --primary: #3b82f6; --danger: #ef4444; --success: #22c55e; --warning: #f59e0b; --pink: #ec4899; --bg: #0f172a; }
        body { 
            font-family: 'Segoe UI', sans-serif; 
            background: linear-gradient(rgba(15, 23, 42, 0.95), rgba(15, 23, 42, 0.98)), 
                        url('https://images.unsplash.com/photo-1490645935967-10de6ba17061?q=80&w=2000&auto=format&fit=crop'); 
            background-size: cover; background-attachment: fixed;
            color: #f8fafc; margin: 0; padding: 15px; padding-bottom: 80px;
        }
        .card { 
            background: rgba(30, 41, 59, 0.95); backdrop-filter: blur(10px);
            padding: 20px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); 
            margin-bottom: 15px; border: 1px solid rgba(51, 65, 85, 0.5); 
        }
        
        .status-header {
            display: flex; justify-content: space-around; text-align: center;
            background: rgba(15, 23, 42, 0.5); padding: 15px; border-radius: 12px;
            margin-bottom: 15px; border: 1px solid rgba(236, 72, 153, 0.2);
        }
        .status-item b { display: block; font-size: 1.1rem; color: var(--pink); }
        .status-item span { font-size: 0.7rem; text-transform: uppercase; color: #94a3b8; letter-spacing: 1px; }

        input, select { 
            width: 100%; padding: 12px; margin: 5px 0; border-radius: 8px; border: none; 
            background: #1e293b; color: white; box-sizing: border-box; font-size: 14px;
        }
        button { cursor: pointer; padding: 12px; border: none; border-radius: 8px; color: white; font-weight: bold; width: 100%; transition: 0.3s; margin-top: 10px; }
        button:hover { opacity: 0.9; transform: scale(1.01); }
        .btn-back { background: var(--primary); text-decoration: none; display: block; text-align: center; padding: 12px; border-radius: 8px; color: white; margin-bottom: 15px; font-weight: bold; }
        
        .kcal-container { margin: 20px 0; text-align: center; }
        .progress-bg { background: #334155; height: 18px; border-radius: 10px; overflow: hidden; position: relative; }
        .progress-fill { background: linear-gradient(90deg, #22c55e, #86efac); height: 100%; width: 0%; transition: width 0.5s ease; }
        .kcal-text { font-size: 22px; font-weight: 900; margin: 10px 0; }
        
        /* Destaques de cores para os números consumidos */
        .highlight-p { color: #a3e635; font-size: 1.1em; } /* Verde Lima */
        .highlight-a { color: #22d3ee; font-size: 1.1em; } /* Ciano Turquesa */

        .food-item {
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(255,255,255,0.03); padding: 10px; border-radius: 8px;
            margin-bottom: 5px; border-left: 3px solid var(--primary);
        }
        .btn-mini-del { background: var(--danger); width: auto; padding: 5px 10px; margin: 0; font-size: 12px; }
    </style>
</head>
<body>

    <a href="./" class="btn-back">⬅ VOLTAR</a>

    <div style="text-align: center; margin-top: 10px; margin-bottom: 20px;">
        <span style="color: #94a3b8; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 3px; display: block;">Guerreiro(a)</span>
        <h2 id="nome-jogador-display" style="margin: 0; color: var(--pink); text-shadow: 0 0 10px rgba(236, 72, 153, 0.4); font-size: 1.8rem; text-transform: capitalize;">---</h2>
    </div>

    <div class="card" style="border-top: 3px solid var(--pink);">
        <div class="status-header">
            <div class="status-item"><span id="st-idade">--</span><span>Idade</span><b id="val-idade">0</b></div>
            <div class="status-item"><span id="st-altura">--</span><span>Altura</span><b id="val-altura">0</b></div>
            <div class="status-item"><span id="st-peso">--</span><span>Peso</span><b id="val-peso">0.0</b></div>
            <div class="status-item"><span id="st-bf">--</span><span>BF%</span><b id="val-bf">0%</b></div>
        </div>
        <h4 style="margin: 0 0 10px 0; font-size: 0.8rem; color: #94a3b8; text-align: center;">CURVA DE EVOLUÇÃO (PESO)</h4>
        <canvas id="evolutionChart" style="max-height: 150px;"></canvas>
    </div>

    <div class="card" style="border-top: 3px solid var(--success);">
        <h2 style="text-align:center; margin:0; color: var(--success);">🥗 Diário Alimentar</h2>
        <div class="kcal-container">
            <div class="kcal-text"><span id="kcal-consumidas">0</span> / <span id="kcal-meta">2000</span> kcal</div>
            <div class="progress-bg"><div id="kcal-bar" class="progress-fill"></div></div>
            
            <div style="display: flex; justify-content: space-around; flex-wrap: wrap; gap: 8px; margin-top: 15px; font-size: 13px; font-weight: bold;">
                <div style="color: #94a3b8;">Proteína: <span id="total-p" class="highlight-p">0</span> / <span id="meta-p">0</span>g</div>
                <div style="color: #94a3b8;">Carboidrato: <span id="total-c" style="color:#fbbf24">0</span>g</div>
                <div style="color: #94a3b8;">Gordura: <span id="total-g" style="color:#f87171">0</span>g</div>
                <div style="color: #94a3b8;">💧 Água: <span id="total-a" class="highlight-a">0</span> / <span id="meta-agua">0</span>ml</div>
            </div>
        </div>

        <div style="display:grid; grid-template-columns: 2fr 1fr; gap:10px;">
            <select id="food-select">
                <option value="">Escolha um alimento...</option>
                <option value="carne_bovina">Carne Bovina (100g)</option>
                <option value="banana_prata">Banana Prata (100g)</option>
                <option value="tapioca">Tapioca Hidratada (100g)</option>
                <option value="whey_protein">Whey Nutrata (100g)</option>
                <option value="coracao_bovino">Coração Bovino (100g)</option>
                <option value="coxa_sobrecoxa">Coxa e Sobrecoxa (100g)</option>
                <option value="peito_de_frango">Peito de Frango (cozido ou grelhado) (100g)</option>
                <option value="carne_de_porco">Pernil Carne de Porco (100g)</option>
                <option value="bebida_alcoolica">Bebida Alcoólica (100g)</option>
                <option value="feijao">Feijão cozido (100g)</option>
                <option value="oleo_de_coco">Óleo de coco (100g)</option>
                <option value="figado_bovino">Figado Bovino (100g)</option>
                <option value="abacate">Abacate (100g)</option>
                <option value="leite_integral">Leite integral (100g)</option>
                <option value="pedaço_de_bolo">Pedaço padrão de Bolo (100g)</option>
                <option value="refrigerante">Refrigerante (100g)</option>
                <option value="ovo_cozido">Ovo cozido (100g)</option>
                <option value="requeijao">Requeijão Light (100g)</option>
                <option value="creme_de_ricota">Creme de Ricota (100g)</option>
                <option value="manteiga">Manteiga (100g)</option>
                <option value="formula">Leite Fórmula (100g)</option>
                <option value="pao_fatia_forma">Pão Integral (100g)</option>
                <option value="acai">Açaí (100g)</option>
                <option value="iogurte_natural">Iogurte Natural (100g)</option>
                <option value="amendoin_torrado">Amendoim Torrado (100g)</option>
                <option value="maca">Maçã (100g)</option>
                <option value="agua">Água (100g)</option>
                <option value="xup_leite">Xup Leite Oliveira (100g)</option>
                <option value="suco">Suco de Laranja (100g)</option>
            </select>
            <input type="number" id="food-qtd" placeholder="Qtd" value="100">
        </div>
        <button onclick="adicionarAlimento()" style="background: var(--success);">➕ ADICIONAR AO PRATO</button>
        <div id="lista-alimentos" style="margin-top: 15px;"></div>
    </div>

    <div class="card" style="border-top: 3px solid #ec4899;">
        <h3 style="text-align:center; color: #ec4899; margin-top: 0;">📊 Configurar Bioestatística</h3>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
            <div><label>Sexo:</label><select id="calc-sexo"><option value="m">Masculino</option><option value="f">Feminino</option></select></div>
            <div><label>Idade:</label><input type="number" id="calc-idade"></div>
            <div><label>Peso (kg):</label><input type="number" id="calc-peso" step="0.1"></div>
            <div><label>Altura (cm):</label><input type="number" id="calc-altura"></div>
            <div><label>Atividade:</label><select id="calc-fator"><option value="1.2">Sedentário</option><option value="1.375" selected>Leve</option><option value="1.55">Moderado</option><option value="1.725">Intenso</option></select></div>
            <div><label>Objetivo:</label><select id="calc-obj"><option value="0">Manter</option><option value="-500">Perder</option><option value="300">Ganhar</option></select></div>
        </div>
        <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 10px;">
            <input type="number" id="calc-pescoco" placeholder="Pescoço">
            <input type="number" id="calc-cintura" placeholder="Cintura">
            <input type="number" id="calc-quadril" placeholder="Quadril">
        </div>
        <button style="background: #ec4899;" onclick="calcularSalvarBio()">💾 SALVAR E REGISTRAR EVOLUÇÃO</button>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBanevR51ejaTE0ccqlmlU6VRh7Qg4EETs",
            authDomain: "aresrpg-7daf4.firebaseapp.com",
            databaseURL: "https://aresrpg-7daf4-default-rtdb.firebaseio.com",
            projectId: "aresrpg-7daf4",
            storageBucket: "aresrpg-7daf4.firebasestorage.app",
            messagingSenderId: "153757603214",
            appId: "1:153757603214:web:fb572985353c8fad7f80df"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database(), auth = firebase.auth();
        let jogador = "", myChart = null;
        const dataKey = new Date().toISOString().split('T')[0];

        const bancoAlimentos = {
            "carne_bovina": { nome: "Carne Bovina", p: 23, g: 21, c: 0, a: 0 },
            "banana_prata": { nome: "Banana Prata", p: 1.3, g: 0.4, c: 22.8, a: 0 },
            "tapioca": { nome: "Tapioca Hidratada", p: 0, g: 0, c: 16.5, a: 0 },
            "whey_protein": { nome: "Whey Nutrata", p: 50, g: 5, c: 32.5, a: 0 },
            "coracao_bovino": { nome: "Coração Bovino", p: 17, g: 2.5, c: 0, a: 0 },
            "coxa_sobrecoxa": { nome: "Coxa e Sobrecoxa", p: 17, g: 14, c: 0, a: 0 },
            "peito_de_frango": { nome: "Peito de Frango (cozido ou grelhado)", p: 29, g: 3, c: 0, a: 0 },
            "carne_de_porco": { nome: "Pernil Carne de Porco", p: 29, g: 13.9, c: 0, a: 0 },
            "bebida_alcoolica": { nome: "Bebida Alcoólica", p: 0.5, g: 0, c: 3.8, a: 0 },
            "feijao": { nome: "Feijão cozido", p: 9, g: 0.7, c: 26, a: 0 },
            "oleo_de_coco": { nome: "Óleo de coco", p: 0, g: 106.4, c: 0, a: 0 },
            "figado_bovino": { nome: "Figado Bovino", p: 26.5, g: 4.7, c: 5.2, a: 0 },
            "abacate": { nome: "Abacate", p: 2, g: 15.3, c: 16, a: 0 },
            "leite_integral": { nome: "Leite integral", p: 3, g: 3, c: 5, a: 0 },
            "pedaço_de_bolo": { nome: "Pedaço padrão de Bolo", p: 5.6, g: 27.2, c: 52.8, a: 0 },
            "refrigerante": { nome: "Refrigerante", p: 0, g: 0, c: 21, a: 0 },
            "ovo_cozido": { nome: "Ovo cozido (50g)", p: 11.5, g: 10.4, c: 1, a: 0 },
            "requeijao": { nome: "Requeijão Light", p: 11, g: 7, c: 0, a: 0 },
            "creme_de_ricota": { nome: "Creme de Ricota", p: 13, g: 13, c: 0, a: 0 },
            "manteiga": { nome: "Manteiga", p: 0, g: 82, c: 0, a: 0 },
            "formula": { nome: "Leite Fórmula", p: 11, g: 26, c: 55, a: 0 },
            "pao_fatia_forma": { nome: "Pão Integral", p: 3, g: 2, c: 13, a: 0 },
            "acai": { nome: "Açaí", p: 0.8, g: 3.9, c: 6, a: 0 },
            "iogurte_natural": { nome: "Iogurte Natural", p: 4.1, g: 3.9, c: 5.9, a: 0 },
            "amendoin_torrado": { nome: "Amendoim Torrado", p: 26, g: 49, c: 9, a: 0 },
            "maca": { nome: "Maçã", p: 0.29, g: 0.17, c: 15.7, a: 0 },
            "agua": { nome: "Água", p: 0, g: 0, c: 0, a: 100 },
            "xup_leite": { nome: "Xup Leite Oliveira", p: 3, g: 3, c: 60, a: 0 },
            "suco": { nome: "Suco de Laranja", p: 0.5, g: 0, c: 8.9, a: 0 }
        };

        auth.onAuthStateChanged(u => {
            if(u) {
                jogador = u.email.split('@')[0].replace(/[.#$[\]]/g, "_");
                carregarDados();
            } else { window.location.href = './'; }
        });

        function carregarDados() {
            document.getElementById('nome-jogador-display').innerText = jogador.replace(/_/g, " ");
            db.ref('rpg_data/' + jogador + '/bio').on('value', s => {
                const d = s.val();
                if(d) {
                    document.getElementById('kcal-meta').innerText = d.metaDiaria || 2000;
                    document.getElementById('val-idade').innerText = d.idade || 0;
                    document.getElementById('val-altura').innerText = d.altura || 0;
                    const pesoAtual = d.peso || 0;
                    document.getElementById('val-peso').innerText = pesoAtual.toFixed(1);
                    document.getElementById('val-bf').innerText = (d.bf || 0) + "%";
                    document.getElementById('meta-agua').innerText = (pesoAtual * 40).toFixed(0);
                    document.getElementById('meta-p').innerText = (pesoAtual * 1.5).toFixed(1);
                }
            });

            db.ref('rpg_data/' + jogador + '/historico').on('value', s => {
                const hist = s.val();
                if(hist) renderizarGrafico(hist);
            });

            db.ref('rpg_data/' + jogador + '/dieta/' + dataKey).on('value', s => renderizarDieta(s.val()));
        }

        function renderizarGrafico(historico) {
            const ctx = document.getElementById('evolutionChart').getContext('2d');
            const labels = Object.keys(historico).sort();
            const weights = labels.map(l => historico[l].peso);
            if (myChart) myChart.destroy();
            myChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels.map(l => l.split('-').reverse().slice(0,2).join('/')),
                    datasets: [{
                        label: 'Peso (kg)',
                        data: weights,
                        borderColor: '#ec4899',
                        backgroundColor: 'rgba(236, 72, 153, 0.1)',
                        fill: true,
                        tension: 0.4,
                        borderWidth: 2,
                        pointRadius: 3
                    }]
                },
                options: { responsive: true, plugins: { legend: { display: false } }, scales: { y: { grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#94a3b8', font: { size: 10 } } }, x: { grid: { display: false }, ticks: { color: '#94a3b8', font: { size: 10 } } } } }
            });
        }

        function adicionarAlimento() {
            const key = document.getElementById('food-select').value;
            const qtd = parseFloat(document.getElementById('food-qtd').value);
            if(!key || !qtd) return;
            const base = bancoAlimentos[key];
            const fator = qtd / 100;
            const p = base.p * fator, c = base.c * fator, g = base.g * fator, a = (base.a || 0) * fator;
            const cal = Math.round((p * 4) + (c * 4) + (g * 9));
            db.ref('rpg_data/' + jogador + '/dieta/' + dataKey).push({ nome: `${base.nome} (${qtd}g)`, cal, p, c, g, a });
        }

        function renderizarDieta(dados) {
            const lista = document.getElementById('lista-alimentos');
            lista.innerHTML = "";
            let tCal = 0, tP = 0, tC = 0, tG = 0, tA = 0;
            if(dados) {
                Object.keys(dados).forEach(k => {
                    const i = dados[k];
                    tCal += i.cal; tP += (i.p||0); tC += (i.c||0); tG += (i.g||0); tA += (i.a||0);
                    lista.innerHTML += `<div class="food-item">
                        <div><b>${i.nome}</b><br><small>${i.cal}kcal | P:${(i.p||0).toFixed(1)} C:${(i.c||0).toFixed(1)} G:${(i.g||0).toFixed(1)} A:${(i.a||0).toFixed(0)}ml</small></div>
                        <button class="btn-mini-del" onclick="remover('${k}')">✕</button>
                    </div>`;
                });
            }
            document.getElementById('kcal-consumidas').innerText = tCal;
            document.getElementById('total-p').innerText = tP.toFixed(1);
            document.getElementById('total-c').innerText = tC.toFixed(1);
            document.getElementById('total-g').innerText = tG.toFixed(1);
            document.getElementById('total-a').innerText = tA.toFixed(0);
            const meta = parseInt(document.getElementById('kcal-meta').innerText);
            document.getElementById('kcal-bar').style.width = Math.min((tCal/meta)*100, 100) + "%";
        }

        function remover(key) { db.ref('rpg_data/' + jogador + '/dieta/' + dataKey + '/' + key).remove(); }

        function calcularSalvarBio() {
            const peso = parseFloat(document.getElementById('calc-peso').value);
            const altura = parseFloat(document.getElementById('calc-altura').value);
            const idade = parseFloat(document.getElementById('calc-idade').value);
            const sexo = document.getElementById('calc-sexo').value, fator = parseFloat(document.getElementById('calc-fator').value), obj = parseInt(document.getElementById('calc-obj').value);
            const pescoco = parseFloat(document.getElementById('calc-pescoco').value), cintura = parseFloat(document.getElementById('calc-cintura').value), quadril = parseFloat(document.getElementById('calc-quadril').value);
            if (!peso || !altura || !idade) return Swal.fire("Atenção", "Preencha os campos básicos!", "warning");
            let tmb = (sexo === 'm') ? (10 * peso) + (6.25 * altura) - (5 * idade) + 5 : (10 * peso) + (6.25 * altura) - (5 * idade) - 161;
            let metaFinal = Math.round((tmb * fator) + obj);
            let bf = null;
            if (pescoco && cintura) {
                if (sexo === 'm') bf = 495 / (1.0324 - 0.19077 * Math.log10(cintura - pescoco) + 0.15456 * Math.log10(altura)) - 450;
                else if (quadril) bf = 495 / (1.29579 - 0.35004 * Math.log10(cintura + quadril - pescoco) + 0.22100 * Math.log10(altura)) - 450;
            }
            const dadosBio = { peso, altura, idade, sexo, fator, objetivo: obj, metaDiaria: metaFinal, bf: bf ? bf.toFixed(1) : 0 };
            db.ref('rpg_data/' + jogador + '/bio').update(dadosBio);
            db.ref('rpg_data/' + jogador + '/historico/' + dataKey).set({ peso, bf: bf ? bf.toFixed(1) : 0 });
            Swal.fire("Sucesso!", "Dados salvos e evolução registrada!", "success");
        }
    </script>
</body>
</html>
