<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ares RPG - Dieta & Bioestatística</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        :root { --primary: #3b82f6; --danger: #ef4444; --success: #22c55e; --warning: #f59e0b; --bg: #0f172a; }
        body { 
            font-family: 'Segoe UI', sans-serif; 
            background: linear-gradient(rgba(15, 23, 42, 0.95), rgba(15, 23, 42, 0.98)), 
                        url('https://images.unsplash.com/photo-1490645935967-10de6ba17061?q=80&w=2000&auto=format&fit=crop'); 
            background-size: cover; background-attachment: fixed;
            color: #f8fafc; margin: 0; padding: 15px; padding-bottom: 80px;
        }
        .card { 
            background: rgba(30, 41, 59, 0.95); backdrop-filter: blur(10px);
            padding: 20px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); 
            margin-bottom: 15px; border: 1px solid rgba(51, 65, 85, 0.5); 
        }
        input, select { 
            width: 100%; padding: 12px; margin: 5px 0; border-radius: 8px; border: none; 
            background: #1e293b; color: white; box-sizing: border-box; font-size: 14px;
        }
        button { 
            cursor: pointer; padding: 12px; border: none; border-radius: 8px; 
            color: white; font-weight: bold; width: 100%; transition: 0.3s; margin-top: 10px;
        }
        button:hover { opacity: 0.9; transform: scale(1.02); }
        .btn-back { 
            background: var(--primary); text-decoration: none; display: block; 
            text-align: center; padding: 12px; border-radius: 8px; color: white; 
            margin-bottom: 15px; font-weight: bold; 
        }
        
        .kcal-container { margin: 20px 0; text-align: center; }
        .progress-bg { background: #334155; height: 20px; border-radius: 10px; overflow: hidden; position: relative; }
        .progress-fill { background: linear-gradient(90deg, #22c55e, #86efac); height: 100%; width: 0%; transition: width 0.5s ease; }
        .kcal-text { font-size: 24px; font-weight: 900; margin: 10px 0; }
        
        .food-item {
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(255,255,255,0.03); padding: 10px; border-radius: 8px;
            margin-bottom: 5px; border-left: 3px solid var(--primary);
        }
        .btn-mini-del { background: var(--danger); width: auto; padding: 5px 10px; margin: 0; font-size: 12px; }
    </style>
</head>
<body>

    <a href="./" class="btn-back">⬅ VOLTAR AO PAINEL</a>

    <div class="card" style="border-top: 3px solid var(--success);">
        <h2 style="text-align:center; margin:0; color: var(--success);">🥗 Diário Alimentar</h2>
        <p style="text-align:center; font-size:12px; color:#94a3b8; margin-top:5px;">Data: <span id="data-hoje">--/--</span></p>

        <div class="kcal-container">
            <div class="kcal-text">
                <span id="kcal-consumidas">0</span> / <span id="kcal-meta">2000</span> kcal
            </div>
            <div class="progress-bg">
                <div id="kcal-bar" class="progress-fill"></div>
            </div>
            
            <div style="display: flex; justify-content: space-around; margin-top: 15px; font-size: 13px; font-weight: bold;">
                <div style="color: #60a5fa;">P: <span id="total-p">0</span>g</div>
                <div style="color: #fbbf24;">C: <span id="total-c">0</span>g</div>
                <div style="color: #f87171;">G: <span id="total-g">0</span>g</div>
            </div>

            <p id="kcal-aviso" style="font-size:12px; color:#fca5a5; margin-top:5px; display:none;">⚠️ Você excedeu sua meta!</p>
        </div>

        <div style="display:grid; grid-template-columns: 2fr 1fr; gap:10px;">
            <select id="food-select">
                <option value="">Escolha um alimento...</option>
                <option value="carne_bovina">Carne Bovina (100g)</option>
                <option value="banana_prata">Banana Prata (100g)</option>
                <option value="tapioca">Tapioca Hidratada (100g)</option>
            </select>
            <input type="number" id="food-qtd" placeholder="Qtd (g)" value="100">
        </div>
        <button onclick="adicionarAlimento()" style="background: var(--success);">➕ ADICIONAR AO PRATO</button>

        <h4 style="margin-bottom:10px; margin-top:20px; border-bottom:1px solid #334155; padding-bottom:5px;">Refeições de Hoje:</h4>
        <div id="lista-alimentos">
            <p style="text-align:center; color:#64748b; font-size:13px;">Nenhum alimento registrado hoje.</p>
        </div>
    </div>

    <div class="card" style="border-top: 3px solid #ec4899;">
        <h3 style="text-align:center; color: #ec4899; margin-top: 0;">📊 Configurar Bioestatística</h3>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
            <div><label>Sexo:</label><select id="calc-sexo"><option value="m">Masculino</option><option value="f">Feminino</option></select></div>
            <div><label>Idade:</label><input type="number" id="calc-idade" placeholder="Anos"></div>
            <div><label>Peso (kg):</label><input type="number" id="calc-peso" placeholder="kg"></div>
            <div><label>Altura (cm):</label><input type="number" id="calc-altura" placeholder="cm"></div>
            <div><label>Atividade:</label>
                <select id="calc-fator">
                    <option value="1.2">Sedentário</option>
                    <option value="1.375" selected>Leve (1-3 dias)</option>
                    <option value="1.55">Moderado (3-5 dias)</option>
                    <option value="1.725">Intenso (6-7 dias)</option>
                </select>
            </div>
            <div><label>Objetivo:</label>
                <select id="calc-obj">
                    <option value="0">Manter</option>
                    <option value="-500">Perder Peso</option>
                    <option value="300">Ganhar Massa</option>
                </select>
            </div>
        </div>
        <div style="margin-top:10px;">
            <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px;">
                <input type="number" id="calc-pescoco" placeholder="Pescoço">
                <input type="number" id="calc-cintura" placeholder="Cintura">
                <input type="number" id="calc-quadril" placeholder="Quadril">
            </div>
        </div>
        <button style="background: #ec4899;" onclick="calcularSalvarBio()">💾 CALCULAR E SALVAR PERFIL</button>
        <div id="resultado-bio" style="display:none; margin-top: 15px; background: rgba(0,0,0,0.2); padding:10px; border-radius:10px;">
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; text-align:center;">
                <div><span style="font-size:10px; color:#cbd5e1;">Meta Sugerida</span><br><b style="color:#22c55e; font-size:18px;" id="res-meta">--</b></div>
                <div><span style="font-size:10px; color:#cbd5e1;">% Gordura</span><br><b style="color:#f59e0b; font-size:18px;" id="res-bf">--</b></div>
                <div><span style="font-size:10px; color:#cbd5e1;">Peso Ideal</span><br><b style="color:#3b82f6; font-size:18px;" id="res-peso-ideal">--</b></div>
                <div><span style="font-size:10px; color:#cbd5e1;">Basal (Repouso)</span><br><b style="color:#94a3b8; font-size:18px;" id="res-basal">--</b></div>
            </div>
        </div>
    </div>

    <script>
        window.alert = function(msg) {
            Swal.fire({ text: msg, confirmButtonColor: '#3b82f6', background: '#1e293b', color: '#fff' });
        };

        const firebaseConfig = {
            apiKey: "AIzaSyBanevR51ejaTE0ccqlmlU6VRh7Qg4EETs",
            authDomain: "aresrpg-7daf4.firebaseapp.com",
            databaseURL: "https://aresrpg-7daf4-default-rtdb.firebaseio.com",
            projectId: "aresrpg-7daf4",
            storageBucket: "aresrpg-7daf4.firebasestorage.app",
            messagingSenderId: "153757603214",
            appId: "1:153757603214:web:fb572985353c8fad7f80df"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database(), auth = firebase.auth();
        let jogador = "";
        
        const hojeRaw = new Date();
        const dataKey = hojeRaw.toISOString().split('T')[0]; 
        document.getElementById('data-hoje').innerText = hojeRaw.toLocaleDateString('pt-BR');

        // BANCO DE DADOS DE ALIMENTOS
        const bancoAlimentos = {
            "carne_bovina": { nome: "Carne Bovina", p: 23, g: 21, c: 0 },
            "banana_prata": { nome: "Banana Prata", p: 1.3, g: 0.4, c: 22.8 },
            "tapioca": { nome: "Tapioca Hidratada", p: 0, g: 0, c: 16.5 }
        };

        auth.onAuthStateChanged(u => {
            if(u) {
                jogador = u.email.split('@')[0].replace(/[.#$[\]]/g, "_");
                carregarDados();
            } else {
                window.location.href = './';
            }
        });

        function carregarDados() {
            db.ref('rpg_data/' + jogador + '/bio').on('value', s => {
                const d = s.val();
                if(d) {
                    if(d.metaDiaria) document.getElementById('kcal-meta').innerText = d.metaDiaria;
                    exibirResultadosVisuais(d);
                }
            });

            db.ref('rpg_data/' + jogador + '/dieta/' + dataKey).on('value', s => {
                renderizarDieta(s.val() || {});
            });
        }

        function adicionarAlimento() {
            const foodKey = document.getElementById('food-select').value;
            const qtd = parseFloat(document.getElementById('food-qtd').value);
            if(!foodKey || !qtd) return alert("Selecione um alimento e a quantidade!");

            const base = bancoAlimentos[foodKey];
            const fator = qtd / 100;
            const pPortion = base.p * fator;
            const cPortion = base.c * fator;
            const gPortion = base.g * fator;
            const kcalCalculada = Math.round((pPortion * 4) + (cPortion * 4) + (gPortion * 9));

            db.ref('rpg_data/' + jogador + '/dieta/' + dataKey).push({
                nome: `${base.nome} (${qtd}g)`,
                cal: kcalCalculada,
                p: pPortion, c: cPortion, g: gPortion,
                horario: Date.now()
            });
            document.getElementById('food-select').value = "";
        }

        function renderizarDieta(dadosDia) {
            const lista = document.getElementById('lista-alimentos');
            lista.innerHTML = "";
            let totalCal = 0, totalP = 0, totalC = 0, totalG = 0;

            Object.keys(dadosDia).forEach(key => {
                const item = dadosDia[key];
                totalCal += (item.cal || 0);
                totalP += (item.p || 0); totalC += (item.c || 0); totalG += (item.g || 0);
                lista.innerHTML += `
                    <div class="food-item">
                        <div><b>${item.nome}</b><span style="font-size:11px; color:#94a3b8; display:block;">${item.cal} kcal | P:${item.p?.toFixed(1)} C:${item.c?.toFixed(1)} G:${item.g?.toFixed(1)}</span></div>
                        <button class="btn-mini-del" onclick="removerAlimento('${key}')">✕</button>
                    </div>`;
            });

            document.getElementById('kcal-consumidas').innerText = totalCal;
            document.getElementById('total-p').innerText = totalP.toFixed(1);
            document.getElementById('total-c').innerText = totalC.toFixed(1);
            document.getElementById('total-g').innerText = totalG.toFixed(1);
            
            const meta = parseInt(document.getElementById('kcal-meta').innerText) || 2000;
            const bar = document.getElementById('kcal-bar');
            bar.style.width = Math.min((totalCal / meta) * 100, 100) + "%";
            document.getElementById('kcal-aviso').style.display = totalCal > meta ? "block" : "none";
        }

        function removerAlimento(key) { db.ref('rpg_data/' + jogador + '/dieta/' + dataKey + '/' + key).remove(); }

        function calcularSalvarBio() {
            const peso = parseFloat(document.getElementById('calc-peso').value);
            const altura = parseFloat(document.getElementById('calc-altura').value);
            const idade = parseFloat(document.getElementById('calc-idade').value);
            const sexo = document.getElementById('calc-sexo').value;
            const fator = parseFloat(document.getElementById('calc-fator').value);
            const obj = parseInt(document.getElementById('calc-obj').value);
            if (!peso || !altura || !idade) return alert("Preencha Peso, Altura e Idade!");

            let tmb = (sexo === 'm') ? (10 * peso) + (6.25 * altura) - (5 * idade) + 5 : (10 * peso) + (6.25 * altura) - (5 * idade) - 161;
            let metaFinal = Math.round((tmb * fator) + obj);

            db.ref('rpg_data/' + jogador + '/bio').update({ peso, altura, idade, sexo, fator, objetivo: obj, metaDiaria: metaFinal, basal: Math.round(tmb) }).then(() => {
                Swal.fire({ title: 'Perfil Atualizado!', text: `Sua meta é ${metaFinal} kcal.`, icon: 'success', background: '#1e293b', color: '#fff' });
            });
        }

        function exibirResultadosVisuais(d) {
            document.getElementById('resultado-bio').style.display = 'block';
            document.getElementById('res-meta').innerText = (d.metaDiaria || "--") + " kcal";
            document.getElementById('res-basal').innerText = (d.basal || "--") + " kcal";
        }
    </script>
</body>
</html>
