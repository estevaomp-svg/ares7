<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ares RPG - Oficial</title>
    
    <meta property="og:title" content="Ares RPG - Oficial">
    <meta property="og:description" content="Evolua seu personagem na vida real! Treine, estude e conquiste recompensas.">
    <meta property="og:image" content="https://i.ibb.co/X3vDgg/image.png">
    <meta property="og:type" content="website">

    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

    <style>
        :root { --primary: #3b82f6; --danger: #ef4444; --success: #22c55e; --warning: #fbbf24; --bg: #0f172a; }
        body { 
            font-family: 'Segoe UI', sans-serif; 
            background: linear-gradient(rgba(15, 23, 42, 0.9), rgba(15, 23, 42, 0.9)), url('https://i.ibb.co/X3vDgg/image.png'); 
            background-size: cover; 
            background-attachment: fixed; 
            color: white; 
            margin: 0; 
            padding: 20px; 
            display: flex; 
            justify-content: center; 
        }
        .card { background: rgba(30, 41, 59, 0.95); padding: 25px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); width: 100%; max-width: 450px; border: 1px solid rgba(255,255,255,0.1); backdrop-filter: blur(10px); }
        .btn { width: 100%; padding: 12px; border: none; border-radius: 10px; cursor: pointer; font-weight: 600; transition: 0.3s; margin-top: 10px; color: white; background: var(--primary); font-size: 15px; }
        .btn:hover { filter: brightness(1.2); transform: translateY(-2px); }
        .aba { display: none; width: 100%; }
        input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: white; margin-bottom: 12px; box-sizing: border-box; }
        
        /* Estilos das Tabelas de Ranking */
        table { width: 100%; border-collapse: collapse; margin-top: 15px; background: rgba(0,0,0,0.2); border-radius: 10px; overflow: hidden; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid rgba(255,255,255,0.05); }
        th { background: rgba(59, 130, 246, 0.2); color: var(--primary); font-size: 13px; text-transform: uppercase; }

        /* Jogo da Velha */
        .velha-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 20px 0; }
        .velha-cell { height: 80px; background: #334155; display: flex; align-items: center; justify-content: center; font-size: 32px; font-weight: bold; cursor: pointer; border-radius: 12px; transition: 0.2s; }
        #res-velha-msg { display: none; padding: 15px; border-radius: 10px; text-align: center; margin-top: 15px; font-weight: bold; }
        .show { display: block !important; }
        .msg-win { background: var(--success); }
        .msg-lose { background: var(--danger); }
    </style>
</head>
<body>

    <div id="aba-auth" class="aba" style="display:block;">
        <div class="card">
            <h2 style="text-align:center;">⚔️ Ares RPG</h2>
            <input type="email" id="email" placeholder="Email">
            <input type="password" id="pass" placeholder="Senha">
            <button class="btn" onclick="login()">Entrar</button>
            <button class="btn" onclick="cadastrar()" style="background:transparent; border: 1px solid var(--primary);">Criar Conta</button>
        </div>
    </div>

    <div id="aba-home" class="aba">
        <div class="card">
            <div style="display:flex; align-items:center; gap:15px; margin-bottom:20px;">
                <img id="p-img" src="" style="width:70px; height:70px; border-radius:50%; border:3px solid var(--primary); object-fit: cover;">
                <div>
                    <h3 id="p-nick" style="margin:0;">Jogador</h3>
                    <p style="margin:5px 0 0 0; color:var(--warning); font-weight:bold;">⭐ <span id="p-xp">0</span> XP | 💰 <span id="p-coins">0</span></p>
                </div>
            </div>
            
            <nav>
                <button class="btn" onclick="mudarAba('treino')">🏟️ Arena de Treino</button>
                <button class="btn" onclick="mudarAba('rankings')" style="background: var(--warning); color: #000;">🏆 Hall da Fama</button>
                <button class="btn" onclick="mudarAba('loja')" style="background: var(--success);">🏪 Loja de Itens</button>
                <button class="btn" onclick="mudarAba('perfil')" style="background: #64748b;">⚙️ Configurações</button>
                <button class="btn" onclick="logout()" style="background: var(--danger); margin-top:20px;">Sair</button>
            </nav>
        </div>
    </div>

    <div id="aba-rankings" class="aba">
        <div class="card">
            <h2 style="text-align:center;">🏆 Hall da Fama</h2>
            <hr style="opacity:0.1;">
            
            <h3>🏅 Ranking de Honra (XP)</h3>
            <table>
                <thead><tr><th>Pos</th><th>Nome</th><th>XP</th></tr></thead>
                <tbody id="ranking-body"></tbody>
            </table>

            <br>
            <h3>🎮 Mestres da Velha (Vitórias)</h3>
            <table>
                <thead><tr><th>Pos</th><th>Nome</th><th>Vitórias</th></tr></thead>
                <tbody id="ranking-velha-body"></tbody>
            </table>

            <button class="btn" onclick="mudarAba('home')" style="background:#64748b; margin-top:20px;">Voltar</button>
        </div>
    </div>

    <div id="aba-treino" class="aba">
        <div class="card">
            <h2>🏟️ Sala de Treino</h2>
            <p>Vença o NPC para ganhar +10 XP e +10 Moedas.</p>
            <button class="btn" onclick="abrirVelha()">Jogar Partida</button>
            <button class="btn" onclick="mudarAba('home')" style="background:#64748b;">Voltar</button>

            <div id="arena-velha" style="display:none; margin-top:20px; border-top:1px solid rgba(255,255,255,0.1); padding-top:20px;">
                <p id="turn-velha-msg" style="text-align:center; font-weight:bold;">Sua Vez (X)</p>
                <div class="velha-grid">
                    <div class="velha-cell" onclick="cliqueVelha(0)"></div>
                    <div class="velha-cell" onclick="cliqueVelha(1)"></div>
                    <div class="velha-cell" onclick="cliqueVelha(2)"></div>
                    <div class="velha-cell" onclick="cliqueVelha(3)"></div>
                    <div class="velha-cell" onclick="cliqueVelha(4)"></div>
                    <div class="velha-cell" onclick="cliqueVelha(5)"></div>
                    <div class="velha-cell" onclick="cliqueVelha(6)"></div>
                    <div class="velha-cell" onclick="cliqueVelha(7)"></div>
                    <div class="velha-cell" onclick="cliqueVelha(8)"></div>
                </div>
                <div id="res-velha-msg"></div>
            </div>
        </div>
    </div>

    <div id="aba-loja" class="aba">
        <div class="card">
            <h2>🏪 Loja</h2>
            <div id="lista-loja"></div>
            <button class="btn" onclick="mudarAba('home')" style="background:#64748b; margin-top:20px;">Voltar</button>
        </div>
    </div>

    <div id="aba-perfil" class="aba">
        <div class="card">
            <h2>⚙️ Perfil</h2>
            <input type="text" id="edit-nick" placeholder="Nick">
            <input type="text" id="edit-photo" placeholder="URL da Foto">
            <button class="btn" onclick="salvarPerfil()">Salvar</button>
            <button class="btn" onclick="mudarAba('home')" style="background:#64748b;">Voltar</button>
        </div>
    </div>

    <script>
        // CONFIGURAÇÃO FIREBASE (COLOCA AS TUAS CHAVES AQUI)
        const firebaseConfig = {
            apiKey: "AIzaSy...",
            authDomain: "ares...",
            databaseURL: "https://ares...",
            projectId: "ares...",
            storageBucket: "ares...",
            messagingSenderId: "...",
            appId: "..."
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();

        let jogadorAtual = null;
        let dadosGerais = {};
        let vitoriasVelha = {};
        let jogandoContraNPC = false;

        // TEUS NPCs ORIGINAIS
        const NPCs = [
            { id: 'npc_1', nick: 'MiguelK1', xp: 1200, vitorias: 15, photo: 'https://i.pravatar.cc/150?u=1' },
            { id: 'npc_2', nick: 'Sofia_Gamer', xp: 950, vitorias: 8, photo: 'https://i.pravatar.cc/150?u=2' },
            { id: 'npc_3', nick: 'Marcos_Treino', xp: 1500, vitorias: 20, photo: 'https://i.pravatar.cc/150?u=3' }
        ];

        auth.onAuthStateChanged(user => {
            if (user) {
                jogadorAtual = user.uid;
                db.ref('rpg_data').on('value', s => { 
                    dadosGerais = s.val() || {}; 
                    atualizarTela(); 
                    atualizarRankingGeral(); 
                });
                db.ref('vitorias_velha').on('value', s => { 
                    vitoriasVelha = s.val() || {}; 
                    atualizarRankingVelha(); 
                });
                checkNPCDailyXP();
                mudarAba('home');
            } else {
                mudarAba('auth');
            }
        });

        // FUNÇÃO DE MUDAR ABA ATUALIZADA
        function mudarAba(aba) {
            const abas = ['auth', 'home', 'treino', 'loja', 'perfil', 'rankings'];
            abas.forEach(a => {
                const el = document.getElementById('aba-' + a);
                if(el) el.style.display = (a === aba) ? 'block' : 'none';
            });
        }

        function atualizarTela() {
            const p = dadosGerais[jogadorAtual] || {};
            document.getElementById('p-nick').innerText = p.nick || 'Guerreiro';
            document.getElementById('p-xp').innerText = p.xp || 0;
            document.getElementById('p-coins').innerText = p.coins || 0;
            document.getElementById('p-img').src = p.photo || 'https://via.placeholder.com/70';

            // RECONSTRÓI A LOJA
            const itensLoja = [{n:'Passear', p:19000}, {n:'Auto Presente', p:15000}, {n:'Lanche', p:14000}];
            const container = document.getElementById('lista-loja');
            container.innerHTML = itensLoja.map(i => `
                <div style="background:rgba(255,255,255,0.05); padding:10px; border-radius:10px; margin-bottom:5px; display:flex; justify-content:space-between; align-items:center;">
                    <span>${i.n} (💰 ${i.p})</span>
                    <button class="btn" style="width:auto; margin:0;" onclick="comprar(${i.p}, '${i.n}')">Comprar</button>
                </div>
            `).join('');
        }

        // --- TUA LÓGICA DO JOGO DA VELHA ORIGINAL ---
        function abrirVelha() { document.getElementById('arena-velha').style.display='block'; resetTab(); jogandoContraNPC=true; }
        function resetTab() { document.querySelectorAll('.velha-cell').forEach(c=>c.innerText=""); document.getElementById('turn-velha-msg').innerText="Sua Vez (X)"; }
        
        function cliqueVelha(idx) {
            if(!jogandoContraNPC) return;
            const cells = document.querySelectorAll('.velha-cell');
            if(cells[idx].innerText !== "") return;
            cells[idx].innerText = "X";
            if(checarWinLocal()) return;
            document.getElementById('turn-velha-msg').innerText = "Vez do NPC...";
            setTimeout(movimentoNPC, 600);
        }

        function movimentoNPC() {
            if(!jogandoContraNPC) return;
            let cells = document.querySelectorAll('.velha-cell');
            let v = []; cells.forEach((c,i)=>{if(c.innerText==="") v.push(i);});
            if(v.length>0) {
                cells[v[Math.floor(Math.random()*v.length)]].innerText="O";
                if(checarWinLocal()) return;
                document.getElementById('turn-velha-msg').innerText="Sua Vez!";
            }
        }

        function checarWinLocal() {
            let cells = Array.from(document.querySelectorAll('.velha-cell')).map(c=>c.innerText);
            const linhas = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
            let winner = null;
            for(let l of linhas) { if(cells[l[0]] && cells[l[0]]===cells[l[1]] && cells[l[0]]===cells[l[2]]) { winner=cells[l[0]]; break; } }
            if(winner || !cells.includes("")) {
                let msg = winner==="X" ? "GANHOU!" : (winner==="O" ? "PERDEU!" : "EMPATE!");
                const r = document.getElementById('res-velha-msg');
                r.innerText = msg; r.className = "show " + (winner==="X" ? "msg-win" : "msg-lose");
                if(winner==="X") {
                    db.ref('rpg_data/'+jogadorAtual).update({ xp: (dadosGerais[jogadorAtual].xp||0)+10, coins: (dadosGerais[jogadorAtual].coins||0)+10 });
                    db.ref('vitorias_velha/'+jogadorAtual).transaction(c=>(c||0)+1);
                }
                setTimeout(()=>{ r.className=""; document.getElementById('arena-velha').style.display='none'; jogandoContraNPC=false; }, 2000);
                return true;
            }
            return false;
        }

        // --- RANKINGS (Lógica Consolidada com teus NPCs) ---
        function atualizarRankingGeral() {
            const tb = document.getElementById('ranking-body');
            let list = Object.keys(dadosGerais).map(id=>({ n: dadosGerais[id].nick||id, x: dadosGerais[id].xp||0 }));
            list.sort((a,b)=>b.x - a.x);
            tb.innerHTML = list.slice(0, 10).map((p,i)=> `<tr><td>${i+1}º</td><td>${p.n}</td><td>${p.x}</td></tr>`).join('');
        }

        function atualizarRankingVelha() {
            const tb = document.getElementById('ranking-velha-body');
            let consolidado = {};
            NPCs.forEach(n => consolidado[n.id] = { v: n.vitorias, n: n.nick });
            Object.keys(vitoriasVelha).forEach(id => {
                if(consolidado[id]) consolidado[id].v += vitoriasVelha[id];
                else consolidado[id] = { v: vitoriasVelha[id], n: (dadosGerais[id] ? dadosGerais[id].nick : id) };
            });
            let list = Object.values(consolidado).sort((a,b)=>b.v - a.v);
            tb.innerHTML = list.slice(0, 10).map((p,i)=> `<tr><td>${i+1}º</td><td>${p.n}</td><td>${p.v}</td></tr>`).join('');
        }

        // --- FUNÇÕES DE PERFIL E LOJA ---
        function login() { auth.signInWithEmailAndPassword(document.getElementById('email').value, document.getElementById('pass').value); }
        function cadastrar() { auth.createUserWithEmailAndPassword(document.getElementById('email').value, document.getElementById('pass').value); }
        function logout() { auth.signOut(); }
        function salvarPerfil() { db.ref('rpg_data/'+jogadorAtual).update({ nick: document.getElementById('edit-nick').value, photo: document.getElementById('edit-photo').value.trim() }).then(() => mudarAba('home')); }
        function comprar(pr, n) { 
            if(dadosGerais[jogadorAtual].coins >= pr) { 
                db.ref('rpg_data/'+jogadorAtual).update({coins: dadosGerais[jogadorAtual].coins - pr}); 
                alert("Resgatado!"); 
            } else { alert("Moedas insuficientes!"); }
        }

        // --- SISTEMA DE XP DIÁRIO NPC ---
        function checkNPCDailyXP() {
            const hoje = new Date().toLocaleDateString().replace(/\//g, '-');
            db.ref('config/lastNPCUpdate').get().then(s => {
                if(s.val() !== hoje) {
                    NPCs.forEach(npc => {
                        db.ref('rpg_data/' + npc.id).transaction(currentData => {
                            if (!currentData) return { nick: npc.nick, xp: npc.xp + 300, photo: npc.photo };
                            return { ...currentData, xp: (currentData.xp || npc.xp) + 300 };
                        });
                    });
                    db.ref('config/lastNPCUpdate').set(hoje);
                }
            });
        }
    </script>
</body>
</html>
