<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ares7 - Trade Crash</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        :root { --primary: #3b82f6; --bg: #0f172a; --card: #1e293b; }
        body { background: var(--bg); color: white; font-family: 'Segoe UI', sans-serif; overflow-x: hidden; }
        
        .chart-box {
            position: relative;
            height: 300px;
            background: #1e293b;
            border: 2px solid #334155;
            border-radius: 24px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 0 50px rgba(0,0,0,0.5);
        }

        #chartFill {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 0%;
            background: linear-gradient(0deg, rgba(34, 197, 94, 0.4) 0%, rgba(34, 197, 94, 0) 100%);
            transition: height 0.1s linear;
            z-index: 1;
        }

        #chartLine {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: #22c55e;
            box-shadow: 0px 0px 20px #22c55e;
            z-index: 2;
            transition: bottom 0.1s linear;
        }

        #displayMult {
            position: relative;
            z-index: 10;
            font-size: 5rem;
            font-weight: 900;
            text-shadow: 0 0 30px rgba(0,0,0,0.8);
        }

        .crash-effect { background: rgba(239, 68, 68, 0.2) !important; animation: shake 0.2s infinite; }
        @keyframes shake { 0% { transform: translate(1px, 1px); } 50% { transform: translate(-1px, -1px); } 100% { transform: translate(1px, 1px); } }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div id="gameContainer" class="w-full max-w-md space-y-6 opacity-0 transition-opacity duration-500">
        <div class="flex justify-between items-center bg-slate-800/50 p-4 rounded-2xl border border-slate-700">
            <div>
                <h1 class="text-xl font-black italic text-blue-400">ARES7 <span class="text-white">TRADE</span></h1>
                <p id="statusModo" class="text-[10px] font-bold tracking-widest text-slate-400 uppercase">CARREGANDO...</p>
            </div>
            <button onclick="alternarModo()" class="bg-slate-700 hover:bg-slate-600 p-2 px-4 rounded-xl text-xs font-bold">MODO</button>
        </div>

        <div id="mainChart" class="chart-box">
            <div id="chartFill"></div>
            <div id="chartLine"></div>
            <div id="displayMult">1.00x</div>
            <div id="crashLabel" class="absolute hidden z-20 text-red-500 text-5xl font-black italic">CRASHED!</div>
        </div>

        <div class="bg-slate-800/50 p-6 rounded-3xl border border-slate-700 shadow-xl space-y-4">
            <div class="flex justify-between items-end">
                <span class="text-xs text-slate-400 font-bold">SALDO DISPONÍVEL</span>
                <span id="txtSaldo" class="text-xl font-black text-green-400">R$ 0,00</span>
            </div>

            <div class="relative">
                <span class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-500 font-bold">R$</span>
                <input type="number" id="inputAposta" value="10" class="w-full bg-slate-900 border border-slate-700 p-4 pl-12 rounded-2xl text-2xl font-black outline-none focus:border-blue-500">
            </div>

            <button id="btnAcao" onclick="controlarJogo()" class="w-full bg-blue-600 hover:bg-blue-500 py-5 rounded-2xl font-black text-2xl shadow-lg active:scale-95 transition-all">COMEÇAR TRADE</button>
        </div>
        
        <p class="text-center text-[10px] text-slate-500 uppercase tracking-tighter">Conectado como: <span id="userEmail">...</span></p>
    </div>

<script>
    // --- CONFIGURAÇÃO FIREBASE (IGUAL AO TEU INDEX.HTML) ---
    const firebaseConfig = {
        apiKey: "AIzaSyBanevR51ejaTE0ccqlmlU6VRh7Qg4EETs",
        authDomain: "aresrpg-7daf4.firebaseapp.com",
        databaseURL: "https://aresrpg-7daf4-default-rtdb.firebaseio.com",
        projectId: "aresrpg-7daf4",
        storageBucket: "aresrpg-7daf4.firebasestorage.app",
        messagingSenderId: "153757603214",
        appId: "1:153757603214:web:fb572985353c8fad7f80df"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();

    let userLogado = null;
    let modoReal = false;
    let jogando = false;
    let multiplicador = 1.00;
    let loop;
    let pontoDeCrash;
    let saldoSimulado = 1000.00;

    // --- INTEGRAÇÃO DE CONTA (IGUAL À DIETA E AVALIAÇÃO) ---
    auth.onAuthStateChanged(user => {
        if (user) {
            userLogado = user;
            document.getElementById('userEmail').innerText = user.email;
            document.getElementById('gameContainer').style.opacity = "1";
            carregarDados();
        } else {
            // Se não estiver logado, manda para a página principal
            Swal.fire({
                title: "Acesso Negado",
                text: "Tens de estar logado no Ares7 para aceder ao Cassino.",
                icon: "warning",
                confirmButtonColor: "#3b82f6",
                confirmButtonText: "Fazer Login"
            }).then(() => {
                window.location.href = "../index.html";
            });
        }
    });

    function carregarDados() {
        if (!modoReal) {
            document.getElementById('txtSaldo').innerText = `R$ ${saldoSimulado.toFixed(2)}`;
            document.getElementById('statusModo').innerText = "MODO SIMULAÇÃO";
            document.getElementById('statusModo').className = "text-[10px] font-bold tracking-widest text-slate-400 uppercase";
        } else {
            db.ref(`cassino/usuarios/${userLogado.uid}/saldoReal`).on('value', snap => {
                const saldo = snap.val() || 0;
                document.getElementById('txtSaldo').innerText = `R$ ${saldo.toFixed(2)}`;
                document.getElementById('statusModo').innerText = "MODO REAL ATIVO";
                document.getElementById('statusModo').className = "text-[10px] font-bold tracking-widest text-red-500 uppercase";
            });
        }
    }

    function alternarModo() {
        if (!userLogado) return;
        db.ref(`cassino/usuarios/${userLogado.uid}`).once('value', snap => {
            const data = snap.val();
            if (data && data.modoRealAtivo) {
                modoReal = !modoReal;
                carregarDados();
                Swal.fire("Modo Alterado", modoReal ? "Operando com Saldo Real" : "Operando em Simulação", "info");
            } else {
                Swal.fire("Bloqueado", "Modo Real exige autorização manual (Depósito).", "error");
            }
        });
    }

    function controlarJogo() {
        if (!jogando) iniciar();
        else vender();
    }

    function iniciar() {
        const aposta = parseFloat(document.getElementById('inputAposta').value);
        if (aposta <= 0 || isNaN(aposta)) return;

        jogando = true;
        multiplicador = 1.00;
        document.getElementById('mainChart').classList.remove('crash-effect');
        document.getElementById('crashLabel').classList.add('hidden');
        document.getElementById('displayMult').className = "text-white";
        document.getElementById('btnAcao').innerText = "VENDER (CASH OUT)";
        document.getElementById('btnAcao').classList.replace('bg-blue-600', 'bg-orange-500');

        pontoDeCrash = (Math.random() * 4 + 1.1).toFixed(2);

        loop = setInterval(() => {
            multiplicador += 0.01;
            const mFix = multiplicador.toFixed(2);
            document.getElementById('displayMult').innerText = mFix + "x";
            let altura = Math.min((multiplicador - 1) * 25, 100); 
            document.getElementById('chartFill').style.height = altura + "%";
            document.getElementById('chartLine').style.bottom = altura + "%";

            if (multiplicador >= pontoDeCrash) crash();
        }, 75);
    }

    function vender() {
        clearInterval(loop);
        jogando = false;
        const aposta = parseFloat(document.getElementById('inputAposta').value);
        const lucroFinal = (aposta * multiplicador).toFixed(2);

        if (modoReal) {
            db.ref(`cassino/usuarios/${userLogado.uid}`).once('value', snap => {
                const data = snap.val();
                const limite = data.limitePremio || 100;
                const saldoAtual = data.saldoReal || 0;
                let ganhoReal = parseFloat(lucroFinal);

                if ((saldoAtual + ganhoReal) > limite) {
                    ganhoReal = Math.max(0, limite - saldoAtual);
                    Swal.fire("Limite Atingido", "Prémio limitado ao valor investido.", "info");
                }
                
                db.ref(`cassino/usuarios/${userLogado.uid}/saldoReal`).transaction(atual => (atual || 0) + ganhoReal);
            });
        } else {
            saldoSimulado += parseFloat(lucroFinal);
        }

        Swal.fire("Trade Fechado!", `Ganho: R$ ${lucroFinal}`, "success");
        resetInterface();
    }

    function crash() {
        clearInterval(loop);
        jogando = false;
        document.getElementById('mainChart').classList.add('crash-effect');
        document.getElementById('displayMult').className = "text-red-500";
        document.getElementById('crashLabel').classList.remove('hidden');
        
        const aposta = parseFloat(document.getElementById('inputAposta').value);
        if (modoReal) {
            db.ref(`cassino/usuarios/${userLogado.uid}/saldoReal`).transaction(atual => Math.max(0, (atual || 0) - aposta));
        } else {
            saldoSimulado -= aposta;
        }

        setTimeout(() => resetInterface(), 2000);
    }

    function resetInterface() {
        document.getElementById('btnAcao').innerText = "COMEÇAR TRADE";
        document.getElementById('btnAcao').classList.replace('bg-orange-500', 'bg-blue-600');
        document.getElementById('chartFill').style.height = "0%";
        document.getElementById('chartLine').style.bottom = "0%";
        carregarDados();
    }
</script>
</body>
</html>
