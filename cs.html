<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ares7 - Trade Game</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #0f172a; color: white; }
        .chart-bg { background: radial-gradient(circle, #1e293b 0%, #0f172a 100%); }
        .multiplier-text { text-shadow: 0 0 20px rgba(59, 130, 246, 0.5); }
    </style>
</head>
<body class="chart-bg min-h-screen flex flex-col items-center p-4">

    <div class="w-full max-w-md bg-slate-800/50 p-6 rounded-3xl border border-slate-700 shadow-2xl">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-xl font-bold italic text-blue-400">ARES7 <span class="text-white">CS</span></h1>
            <div id="statusModo" class="px-3 py-1 rounded-full text-xs font-bold bg-blue-500/20 text-blue-400 border border-blue-500/50">SIMULAÇÃO</div>
        </div>

        <div class="relative h-48 flex items-center justify-center border-b border-slate-700 mb-6">
            <div id="displayMult" class="multiplier-text text-6xl font-black text-white">1.00x</div>
            <div id="crashLabel" class="absolute hidden text-red-500 text-4xl font-bold">CRASHED!</div>
        </div>

        <div class="space-y-4">
            <div class="bg-slate-900 p-4 rounded-2xl border border-slate-700">
                <p class="text-xs text-slate-400 mb-1">SALDO DISPONÍVEL</p>
                <p id="txtSaldo" class="text-xl font-bold text-green-400">R$ 0,00</p>
            </div>

            <input type="number" id="inputAposta" value="10" class="w-full bg-slate-900 border border-slate-700 p-4 rounded-2xl text-center text-xl font-bold outline-none focus:border-blue-500">

            <button id="btnJogar" class="w-full bg-blue-600 hover:bg-blue-500 py-5 rounded-2xl font-black text-2xl transition-all shadow-lg shadow-blue-900/20">COMEÇAR TRADE</button>
        </div>

        <button onclick="tentarModoReal()" class="mt-6 w-full text-xs text-slate-500 hover:text-slate-300 underline">Alternar para Modo Real</button>
    </div>

<script>
    // --- CONFIGURAÇÃO (COLE A SUA AQUI) ---
    const firebaseConfig = {
        apiKey: "SUA_API_KEY",
        authDomain: "SEU_PROJETO.firebaseapp.com",
        databaseURL: "https://SEU_PROJETO.firebaseio.com",
        projectId: "SEU_PROJETO",
        storageBucket: "SEU_PROJETO.appspot.com",
        messagingSenderId: "ID",
        appId: "APP_ID"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();

    let userLogado = null;
    let modoReal = false;
    let jogando = false;
    let mult = 1.00;
    let loop;
    let saldoSimulado = 1000.00;

    // Monitorar Login
    auth.onAuthStateChanged(user => {
        if (user) {
            userLogado = user;
            atualizarSaldo();
        } else {
            Swal.fire("Login Necessário", "Você precisa estar logado no Ares7 para jogar.", "warning");
        }
    });

    function atualizarSaldo() {
        if (!modoReal) {
            document.getElementById('txtSaldo').innerText = `R$ ${saldoSimulado.toFixed(2)}`;
            document.getElementById('statusModo').innerText = "SIMULAÇÃO";
        } else {
            db.ref(`cassino/usuarios/${userLogado.uid}/saldoReal`).on('value', snap => {
                const saldo = snap.val() || 0;
                document.getElementById('txtSaldo').innerText = `R$ ${saldo.toFixed(2)}`;
                document.getElementById('statusModo').innerText = "REAL";
            });
        }
    }

    function tentarModoReal() {
        if (!userLogado) return;
        db.ref(`cassino/usuarios/${userLogado.uid}`).once('value', snap => {
            const data = snap.val();
            if (data && data.modoRealAtivo) {
                modoReal = !modoReal;
                atualizarSaldo();
                Swal.fire("Modo Alterado", modoReal ? "Você está operando com dinheiro REAL." : "Modo Simulação ativado.", "info");
            } else {
                Swal.fire("Acesso Bloqueado", "Deposite R$ 50 e peça liberação manual.", "error");
            }
        });
    }

    const btn = document.getElementById('btnJogar');
    btn.addEventListener('click', () => {
        if (!jogando) {
            iniciarTrade();
        } else {
            pararTrade();
        }
    });

    function iniciarTrade() {
        const aposta = parseFloat(document.getElementById('inputAposta').value);
        if (aposta <= 0) return;

        jogando = true;
        mult = 1.00;
        document.getElementById('crashLabel').classList.add('hidden');
        document.getElementById('displayMult').classList.remove('text-red-500');
        btn.innerText = "CASH OUT (VENDER)";
        btn.classList.replace('bg-blue-600', 'bg-orange-500');

        const pontoDeCrash = (Math.random() * 3 + 1).toFixed(2); // Sorteio simples

        loop = setInterval(() => {
            mult += 0.01;
            document.getElementById('displayMult').innerText = mult.toFixed(2) + "x";

            if (mult >= pontoDeCrash) {
                crash();
            }
        }, 100);
    }

    function pararTrade() {
        clearInterval(loop);
        jogando = false;
        const lucro = (parseFloat(document.getElementById('inputAposta').value) * mult).toFixed(2);
        
        if (!modoReal) {
            saldoSimulado += parseFloat(lucro);
        } else {
            // Lógica para atualizar saldo real no Firebase
            db.ref(`cassino/usuarios/${userLogado.uid}/saldoReal`).transaction(atual => (atual || 0) + parseFloat(lucro));
        }

        Swal.fire("Trade Encerrado", `Lucro de R$ ${lucro}`, "success");
        resetBotoes();
    }

    function crash() {
        clearInterval(loop);
        jogando = false;
        document.getElementById('displayMult').classList.add('text-red-500');
        document.getElementById('crashLabel').classList.remove('hidden');
        
        const aposta = parseFloat(document.getElementById('inputAposta').value);
        if (!modoReal) {
            saldoSimulado -= aposta;
        } else {
            db.ref(`cassino/usuarios/${userLogado.uid}/saldoReal`).transaction(atual => (atual || 0) - aposta);
        }

        resetBotoes();
    }

    function resetBotoes() {
        btn.innerText = "COMEÇAR TRADE";
        btn.classList.replace('bg-orange-500', 'bg-blue-600');
        atualizarSaldo();
    }
</script>
</body>
</html>
