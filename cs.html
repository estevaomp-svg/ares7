<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ares7 - Duelos Reais</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        :root { --primary: #3b82f6; --bg: #0f172a; --card: #1e293b; }
        body { background: var(--bg); color: white; font-family: 'Segoe UI', sans-serif; overflow-x: hidden; }
        
        .chart-box {
            position: relative; height: 180px; background: #1e293b;
            border: 2px solid #334155; border-radius: 24px; overflow: hidden;
            display: flex; align-items: center; justify-content: center;
        }
        
        .velha-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .velha-cell { 
            aspect-ratio: 1; background: #334155; border-radius: 12px; 
            display: flex; align-items: center; justify-content: center; 
            font-size: 2.5rem; font-weight: bold; cursor: pointer; transition: 0.2s; 
        }
        .velha-cell.taken { pointer-events: none; background: #1e293b; }

        .game-disabled { filter: blur(8px); pointer-events: none; opacity: 0.3; transition: 0.5s; }
        .game-active { filter: blur(0); pointer-events: auto; opacity: 1; transition: 0.5s; }
    </style>
</head>
<body class="p-4">

    <div id="gameContainer" class="max-w-md mx-auto space-y-6 opacity-0 transition-opacity">
        
        <div class="flex justify-between items-center bg-slate-800/80 p-4 rounded-2xl border border-slate-700">
            <div>
                <h1 class="text-xl font-black italic text-blue-400">ARES7 <span class="text-white">CS</span></h1>
                <p id="statusModo" class="text-[10px] font-bold tracking-widest uppercase">CARREGANDO...</p>
            </div>
            <button onclick="alternarModo()" class="bg-blue-600 p-2 px-4 rounded-xl text-xs font-bold">ALTERNAR MODO</button>
        </div>

        <div id="sectionCrash" class="bg-slate-800/50 p-4 rounded-3xl border border-slate-700 space-y-4">
            <h2 class="text-xs font-bold text-blue-400 uppercase">Ares7 Trade (Simulador)</h2>
            <div class="chart-box">
                <div id="displayMult" class="text-4xl font-black">1.00x</div>
            </div>
            <div class="flex justify-between items-center bg-slate-900 p-3 rounded-xl">
                <span id="txtSaldo" class="text-lg font-black text-green-400">R$ 0,00</span>
                <input type="number" id="inputAposta" value="10" class="w-20 bg-transparent text-right font-bold outline-none">
            </div>
            <button onclick="controlarJogo()" class="w-full bg-blue-600 py-3 rounded-xl font-bold">TREINAR</button>
        </div>

        <div id="sectionVelha" class="bg-slate-800/50 p-4 rounded-3xl border border-slate-700 space-y-4">
            <h2 class="text-xs font-bold text-orange-400 uppercase">Duelo Real (Jogo da Velha)</h2>
            
            <div id="velhaMenu">
                <div class="flex gap-2">
                    <input type="number" id="apostaVelha" value="5" class="flex-1 bg-slate-900 p-3 rounded-xl font-bold outline-none">
                    <button onclick="buscarOponente()" class="bg-orange-500 px-6 rounded-xl font-bold">DUELAR</button>
                </div>
            </div>

            <div id="velhaGame" class="hidden space-y-4">
                <div class="flex justify-between text-[10px] font-bold">
                    <span id="labelEu">VOCÊ: -</span>
                    <span id="turnoAviso" class="animate-pulse">AGUARDANDO...</span>
                </div>
                <div class="velha-grid" id="grid">
                    <div class="velha-cell" onclick="jogar(0)"></div>
                    <div class="velha-cell" onclick="jogar(1)"></div>
                    <div class="velha-cell" onclick="jogar(2)"></div>
                    <div class="velha-cell" onclick="jogar(3)"></div>
                    <div class="velha-cell" onclick="jogar(4)"></div>
                    <div class="velha-cell" onclick="jogar(5)"></div>
                    <div class="velha-cell" onclick="jogar(6)"></div>
                    <div class="velha-cell" onclick="jogar(7)"></div>
                    <div class="velha-cell" onclick="jogar(8)"></div>
                </div>
            </div>
        </div>
    </div>

<script>
    // CONFIGURAÇÃO FIREBASE
    const firebaseConfig = {
        apiKey: "AIzaSyBanevR51ejaTE0ccqlmlU6VRh7Qg4EETs",
        authDomain: "aresrpg-7daf4.firebaseapp.com",
        databaseURL: "https://aresrpg-7daf4-default-rtdb.firebaseio.com",
        projectId: "aresrpg-7daf4",
        storageBucket: "aresrpg-7daf4.firebasestorage.app",
        messagingSenderId: "153757603214",
        appId: "1:153757603214:web:fb572985353c8fad7f80df"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();

    let userLogado = null;
    let modoReal = false;
    let gameId = null;
    let meuSimbolo = ""; // X ou O
    let meuTurno = false;

    auth.onAuthStateChanged(user => {
        if (user) {
            userLogado = user;
            document.getElementById('gameContainer').style.opacity = "1";
            carregarDados();
            ouvirDesafios();
        } else { window.location.href = "../index.html"; }
    });

    function carregarDados() {
        db.ref(`cassino/usuarios/${userLogado.uid}`).on('value', snap => {
            const d = snap.val() || {};
            const saldo = modoReal ? (d.saldoReal || 0) : (d.saldoSimulado || 1000);
            
            document.getElementById('txtSaldo').innerText = `R$ ${saldo.toFixed(2)}`;
            document.getElementById('statusModo').innerText = modoReal ? "MODO REAL" : "MODO SIMULADO";
            document.getElementById('statusModo').className = modoReal ? "text-[10px] font-bold text-red-500" : "text-[10px] font-bold text-blue-400";
            
            document.getElementById('sectionCrash').className = modoReal ? "game-disabled" : "game-active";
            document.getElementById('sectionVelha').className = modoReal ? "game-active" : "game-disabled";
        });
    }

    function alternarModo() {
        if (!modoReal) {
            db.ref(`cassino/usuarios/${userLogado.uid}/modoRealAtivo`).once('value', s => {
                if (s.val()) { modoReal = true; carregarDados(); }
                else { Swal.fire("Bloqueado", "Ative o modo real no painel.", "info"); }
            });
        } else { modoReal = false; carregarDados(); }
    }

    // LÓGICA DO DUELO
    function ouvirDesafios() {
        db.ref('jogos/velha/desafios').on('child_added', snap => {
            const des = snap.val();
            if (modoReal && des.status === "aberto" && des.uidCriador !== userLogado.uid) {
                Swal.fire({
                    title: "DESAFIO!",
                    text: `Aposta: R$ ${des.aposta}`,
                    showCancelButton: true, confirmButtonText: "ACEITAR"
                }).then(r => { if(r.isConfirmed) aceitar(snap.key, des); });
            }
        });
    }

    function buscarOponente() {
        const valor = parseFloat(document.getElementById('apostaVelha').value);
        const ref = db.ref('jogos/velha/desafios').push();
        ref.set({ uidCriador: userLogado.uid, aposta: valor, status: "aberto" });
        
        Swal.fire({ title: "Buscando...", showCancelButton: true }).then(r => { if(!r.isConfirmed) ref.remove(); });

        ref.child('status').on('value', s => {
            if (s.val() === "aceito") {
                gameId = ref.key; meuSimbolo = "X";
                document.getElementById('labelEu').innerText = "VOCÊ: X";
                iniciarPartida();
            }
        });
    }

    function aceitar(id, dados) {
        db.ref(`jogos/velha/desafios/${id}`).update({ status: "aceito", uidOponente: userLogado.uid });
        db.ref(`jogos/velha/partidas/${id}`).set({
            tabuleiro: ["","","","","","","","",""],
            turno: dados.uidCriador, // Criador começa
            aposta: dados.aposta,
            players: { [dados.uidCriador]: "X", [userLogado.uid]: "O" }
        });
        gameId = id; meuSimbolo = "O";
        document.getElementById('labelEu').innerText = "VOCÊ: O";
        iniciarPartida();
    }

    function iniciarPartida() {
        Swal.close();
        document.getElementById('velhaMenu').classList.add('hidden');
        document.getElementById('velhaGame').classList.remove('hidden');

        db.ref(`jogos/velha/partidas/${gameId}`).on('value', snap => {
            const p = snap.val(); if (!p) return;
            
            const cells = document.querySelectorAll('.velha-cell');
            p.tabuleiro.forEach((v, i) => {
                cells[i].innerText = v;
                cells[i].className = v === "" ? "velha-cell" : "velha-cell taken " + (v === "X" ? "text-blue-400" : "text-orange-400");
            });

            meuTurno = (p.turno === userLogado.uid);
            document.getElementById('turnoAviso').innerText = meuTurno ? "TEU TURNO!" : "AGUARDANDO RIVAL...";
            document.getElementById('turnoAviso').className = meuTurno ? "text-green-400 font-bold" : "text-slate-500";

            if (p.vencedor) finalizar(p.vencedor, p.aposta);
        });
    }

    function jogar(idx) {
        if (!meuTurno) return;
        db.ref(`jogos/velha/partidas/${gameId}`).once('value', snap => {
            const p = snap.val();
            if (p.tabuleiro[idx] === "") {
                p.tabuleiro[idx] = meuSimbolo;
                // Troca de turno: pega o ID do outro jogador no objeto players
                const IDs = Object.keys(p.players);
                const proxTurno = IDs.find(id => id !== userLogado.uid);
                
                db.ref(`jogos/velha/partidas/${gameId}`).update({
                    tabuleiro: p.tabuleiro,
                    turno: proxTurno
                });
                
                verificarVitoria(p.tabuleiro, p.aposta);
            }
        });
    }

    function verificarVitoria(tab, aposta) {
        const metas = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
        for (let m of metas) {
            if (tab[m[0]] && tab[m[0]] === tab[m[1]] && tab[m[0]] === tab[m[2]]) {
                db.ref(`jogos/velha/partidas/${gameId}`).update({ vencedor: userLogado.uid });
                return;
            }
        }
        if (!tab.includes("")) db.ref(`jogos/velha/partidas/${gameId}`).update({ vencedor: "empate" });
    }

    function finalizar(venc, valor) {
        db.ref(`jogos/velha/partidas/${gameId}`).off();
        let msg = venc === "empate" ? "EMPATE!" : (venc === userLogado.uid ? "GANHOU!" : "PERDEU!");
        
        // Lógica de Saldo (Somente no final)
        if (venc === userLogado.uid) {
            db.ref(`cassino/usuarios/${userLogado.uid}/saldoReal`).transaction(s => (s||0) + valor);
        } else if (venc !== "empate") {
            db.ref(`cassino/usuarios/${userLogado.uid}/saldoReal`).transaction(s => (s||0) - valor);
        }

        Swal.fire(msg, `Valor: R$ ${valor}`, "success").then(() => location.reload());
    }
</script>
</body>
</html>
